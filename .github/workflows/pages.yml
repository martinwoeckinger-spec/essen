name: Deploy to GitHub Pages

# Veröffentlicht die statische Single-File-App (index.html) auf GitHub Pages.
on:
  push:
    branches: ["claude/zen-lovelace-MAcnT", "claude/calorie-tracker-pwa-Z6FNb"]
    paths: ["index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deploys vermeiden.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages automatisch (Quelle: GitHub Actions),
          # falls noch nicht eingeschaltet.
          enablement: true

      - name: Build site (nur index.html ausliefern)
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
