<style type="text/tailwindcss">
@theme {
  --color-surface:#f6f3ef; --color-s1:#fffdfb; --color-s2:#ffffff; --color-s3:#f0ebe4; --color-s4:#e7e1d8;
  --color-onsurf:#211f1c; --color-onvar:#55524c; --color-faint:#8a857e;
  --color-primary:#e05e00; --color-onprimary:#ffffff; --color-primaryc:#ffdcc2; --color-onprimaryc:#6d3500;
  --color-line:rgba(0,0,0,.09); --color-danger:#c0341d;
  --radius-card:20px;
  --font-sans:'Roboto','system-ui',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
:root{
  color-scheme:light;
  --bg:#f6f3ef;--bg2:#efeae3;--card:#ffffff;--card2:#f0ebe4;--text:#211f1c;--muted:#55524c;--faint:#8a857e;
  --accent:#e05e00;--accent2:#b24a00;--accent-soft:rgba(224,94,0,.12);--primaryc:#ffdcc2;--onprimaryc:#6d3500;

}
:root[data-theme="dark"]{

  --color-surface:#131316;--color-s1:#191a1e;--color-s2:#202127;--color-s3:#282a30;--color-s4:#31323a;
  --color-onsurf:#e6e1e6;--color-onvar:#b8b5bf;--color-faint:#8a8792;
  --color-primary:#f97316;--color-onprimary:#ffffff;--color-primaryc:#5a3410;--color-onprimaryc:#ffd9bd;
  --color-line:rgba(255,255,255,.08);--color-danger:#f87171;
  --bg:#131316;--bg2:#191a1e;--card:#202127;--card2:#282a30;--text:#e6e1e6;--muted:#b8b5bf;--faint:#8a8792;
  --accent:#f97316;--accent2:#fdba74;--accent-soft:rgba(249,115,22,.16);--primaryc:#5a3410;--onprimaryc:#ffd9bd;
  --danger:#f87171;--track:#3a3b42;--line:rgba(255,255,255,.08);
  --protein:#34d399;--carbs:#38bdf8;--fat:#c084fc;--fiber:#a3e635;--sugar:#f472b6;--satfat:#fb7185;--salt:#94a3b8;--data:#7cc0ff;--good:#22c55e;
  --bar-bg:rgba(20,20,24,.82);--toast-bg:#e8e3ea;--toast-fg:#26272e;--scrim:rgba(0,0,0,.6);
  --shadow-card:0 1px 3px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
.msym{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;user-select:none}
@layer base{
  body{ @apply bg-surface text-onsurf font-sans antialiased; font-size:15px; }
  input,select,button,textarea{ font-family:inherit; }
  h2{ margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; }
}
@layer components{
  .app{ @apply flex flex-col h-full mx-auto; max-width:560px; }
  .content{ @apply flex-1 overflow-y-auto; -webkit-overflow-scrolling:touch; }
  .page{ @apply flex flex-col gap-4; padding:calc(var(--safe-top) + 12px) 16px 28px; }
  .card{ @apply bg-s2 border border-line rounded-[20px] p-5; box-shadow:var(--shadow-card); }
  .card-title{ @apply flex items-center gap-2 text-sm font-bold text-onsurf; margin:0 0 14px; letter-spacing:.01em; }
  .card-title .msym{ font-size:20px; color:var(--accent); }
  .chat-head{ @apply flex justify-between items-center gap-2 flex-wrap; }
  .section-head{ @apply flex justify-between items-center gap-2 flex-wrap; margin-bottom:10px; }
  .section-head .card-title{ margin:0; }
  .section-actions{ @apply flex gap-1.5 flex-wrap; }
  .section-label{ @apply text-onvar; font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin:14px 2px 6px; }
  .tabbar{ @apply flex border-t border-line; background:var(--bar-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding-bottom:var(--safe-bottom); }
  .tab{ @apply flex-1 flex flex-col items-center gap-1 bg-transparent border-0 text-faint cursor-pointer transition-colors; padding:9px 0 7px; }
  .tab-icon{ @apply flex items-center justify-center rounded-full transition-colors; font-size:22px;line-height:1;padding:4px 20px; }
  .tab-label{ font-size:11px;font-weight:500; }
  .tab.active{ @apply text-primary; }
  .tab.active .tab-icon{ @apply bg-primaryc; color:var(--onprimaryc); }
  .tab.active .tab-icon .msym{ font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }
  .theme-toggle{ @apply text-onvar; }
  .brand{ @apply hidden; }
  .brand-icon{ font-size:24px;color:var(--accent); }
  .primary{ @apply inline-flex items-center justify-center gap-1.5 bg-primary text-onprimary border-0 rounded-full font-semibold cursor-pointer transition; padding:12px 24px;box-shadow:0 1px 2px rgba(0,0,0,.16); }
  .primary .msym{ font-size:19px; }
  .erfassen-btn{ @apply flex items-center justify-center gap-2 w-full bg-primary text-onprimary border-0 rounded-[20px] font-bold cursor-pointer transition; padding:16px;font-size:16px;box-shadow:0 6px 20px rgba(224,94,0,.30); }
  .erfassen-btn .msym{ font-size:22px; }
  .chip{ @apply inline-flex items-center gap-1.5 bg-s3 border border-line text-onsurf rounded-lg font-medium cursor-pointer transition; padding:7px 12px;font-size:13px; }
  .chip .msym{ font-size:17px;margin:0 -1px; }
  .nav-btn{ @apply grid place-items-center bg-s3 text-onsurf border-0 rounded-full cursor-pointer transition; width:40px;height:40px; }
  .nav-btn .msym{ font-size:22px; }
  .nav-btn:disabled{ opacity:.3; }
  .del{ @apply grid place-items-center bg-transparent text-onvar border-0 rounded-full cursor-pointer transition; width:32px;height:32px; }
  .del .msym{ font-size:20px; }
  .icon-btn{ @apply grid place-items-center bg-transparent text-onvar border-0 rounded-full cursor-pointer transition; width:32px;height:32px; }
  .icon-btn .msym{ font-size:18px; }
  input,select,textarea{ @apply bg-s3 border border-line text-onsurf rounded-xl w-full outline-none transition; padding:12px 13px;font-size:15px; }
  input:focus,select:focus,textarea:focus{ @apply border-primary; box-shadow:0 0 0 3px var(--accent-soft); }
  input::placeholder,textarea::placeholder{ color:var(--faint); }
  textarea{ resize:vertical; }
  .form{ @apply flex flex-col gap-2; margin:8px 0 12px; }
  .form-grid{ @apply grid gap-2; grid-template-columns:repeat(4,1fr); }
  .form-grid.two{ grid-template-columns:repeat(2,1fr); }
  .field{ margin-bottom:12px; }
  .field label{ @apply block text-onvar font-semibold; font-size:13px;margin-bottom:6px; }
  .field-grid{ @apply grid gap-2; grid-template-columns:repeat(3,1fr); }
  .field-grid.two{ grid-template-columns:repeat(2,1fr); }
  .num-suffix{ @apply relative flex items-center; }
  .num-suffix span{ @apply absolute text-onvar pointer-events-none; right:12px;font-size:13px; }
  .num-static{ @apply bg-s3 border border-line rounded-xl text-onvar; padding:12px 13px; }
  .mini-field{ @apply flex flex-col gap-1; }
  .mini-field span{ @apply text-onvar font-semibold; font-size:11px; }
  .mini-field input{ text-align:center;padding:9px 8px; }
  .pref-text{ line-height:1.4; }
  .seg{ @apply inline-flex gap-1 bg-s3 border border-line rounded-full; padding:4px; }
  .seg button{ @apply bg-transparent border-0 text-onvar rounded-full font-semibold cursor-pointer transition; padding:6px 12px; }
  .seg button.on{ @apply bg-primary text-onprimary; }
  .seg.full{ width:100%; } .seg.full button{ flex:1; }
  .metric-chips{ @apply flex gap-1.5 overflow-x-auto; padding-bottom:10px;-webkit-overflow-scrolling:touch; }
  .metric-chip{ @apply flex-none bg-s3 border border-line text-onvar rounded-lg font-medium cursor-pointer transition; padding:7px 12px;font-size:13px;white-space:nowrap; }
  .metric-chip.on{ @apply bg-primaryc border-primary; color:var(--onprimaryc); }
  .presets{ @apply flex flex-wrap gap-2; margin-bottom:12px; }
  .preset{ @apply bg-s3 border border-line text-onsurf rounded-xl font-semibold cursor-pointer transition; padding:9px 13px;font-size:13px; }
  .preset.on{ @apply border-primary; background:var(--accent-soft); }
  .toggle{ @apply flex items-center gap-2.5 cursor-pointer; font-size:14px; }
  .toggle input{ width:20px;height:20px;accent-color:var(--accent); }
  .pct{ margin-bottom:14px; } .pct-head{ @apply flex justify-between font-semibold; font-size:14px;margin-bottom:4px; }
  .pct input[type=range]{ width:100%;accent-color:var(--accent); }
  .tiles{ @apply grid gap-2.5; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); }
  .tiles .stat{ @apply bg-s2 border border-line rounded-2xl; padding:14px 10px; }
  .stat{ @apply text-center; flex:1; }
  .stat-value{ font-weight:800;font-size:22px;letter-spacing:-.01em; }
  .stat-label{ @apply flex items-center justify-center gap-1 text-onvar; font-size:12px; } .stat-sub{ @apply text-onvar; font-size:11px; }
  .stat-label .msym{ font-size:15px;color:var(--accent); }
  .hero-stats{ @apply flex w-full justify-around; }
  .hero{ @apply flex flex-col items-center gap-4; }
  .datebar{ @apply flex items-center justify-between gap-2; }
  .datebar-label{ @apply inline-flex items-center gap-1 bg-transparent border-0 text-onsurf cursor-pointer rounded-xl; font-size:20px;font-weight:800;padding:6px 10px; }
  .datebar-label .msym{ font-size:22px;color:var(--onvar); }
  .datebar-label:hover{ @apply bg-s3; }
  .date-input{ @apply bg-s3 border border-line text-onsurf rounded-xl; text-align:center;padding:8px 10px;font-weight:700;max-width:200px;width:auto; }
  .toolbar{ @apply flex gap-1.5 flex-wrap justify-center; }
  .macro{ margin-bottom:12px; } .macro:last-child{ margin-bottom:0; }
  .macro-head{ @apply flex justify-between; font-size:14px;margin-bottom:6px; }
  .macro-label{ font-weight:600; } .macro-num{ font-weight:700; }
  .warn-tag{ @apply inline-flex; color:var(--danger); }
  .warn-tag .msym{ font-size:15px; }
  .bar{ @apply rounded-full overflow-hidden; height:8px;background:var(--track); }
  .bar-fill{ @apply rounded-full; height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1); }
  .macro-top{ @apply flex gap-4 items-center flex-wrap; }
  .macro-top .bars{ flex:1;min-width:190px; }
  .energy-row{ @apply flex justify-between text-onvar; font-size:14px;padding:8px 0;border-bottom:1px solid var(--line); }
  .energy-row strong{ @apply text-onsurf; }
  .energy-row.total{ @apply text-onsurf; border-bottom:none;font-size:16px;padding-top:12px; }
  .energy-row.total strong{ color:var(--accent); }
  .avg-row{ @apply flex justify-between; font-size:16px; } .avg-row strong{ color:var(--accent); }
  .empty{ @apply text-onvar; font-size:14px;margin:6px 0 0; }
  .entries{ @apply list-none p-0; margin:8px 0 0; }
  .entry{ @apply flex items-center gap-2.5; padding:11px 0;border-top:1px solid var(--line); }
  .entry-main{ @apply flex-1; min-width:0; }
  .entry-name{ @apply block font-semibold; }
  .entry-qty{ font-size:12px;color:var(--accent2); }
  .entry-macros{ @apply block text-onvar; font-size:12px; }
  .entry-note{ @apply block text-onvar; font-size:12px;font-style:italic;margin-top:2px; }
  .entry-kcal{ font-weight:800;font-variant-numeric:tabular-nums; }
  .entry-kcal.burn{ color:var(--accent2); }
  .entry-actions{ @apply flex items-center; gap:2px; }
  .meal-group{ margin-top:12px; }
  .meal-head{ @apply flex justify-between items-center gap-2 w-full bg-transparent border-0 text-onsurf cursor-pointer rounded-lg transition-colors; text-align:left;padding:10px 4px 8px;margin:0 -4px;border-top:1px solid var(--line);border-radius:0; }
  .meal-head:hover{ @apply text-primary; }
  .meal-head:hover .meal-chevron{ color:var(--accent); }
  .meal-title{ @apply flex items-center gap-2; font-size:14px;font-weight:700; }
  .meal-title .msym{ font-size:19px;color:var(--accent); }
  .meal-count{ @apply inline-flex items-center justify-center bg-s3 text-onvar rounded-full; min-width:20px;height:18px;font-size:11px;font-weight:700;padding:0 6px;margin-left:2px; }
  .meal-head-right{ @apply flex items-center gap-1.5; }
  .meal-kcal{ @apply text-onvar; font-size:13px;font-variant-numeric:tabular-nums; }
  .meal-chevron{ @apply text-faint transition-transform; font-size:20px; }
  .meal-group.collapsed .meal-chevron{ transform:rotate(-90deg); }
  .lede{ @apply text-onvar; font-size:13px;margin:0 0 12px;line-height:1.5; }
  .kpi{ @apply flex items-baseline gap-2; }
  .kpi-big{ font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1; }
  .kpi-unit{ @apply text-onvar; font-size:14px;font-weight:600; }
  .trend{ @apply inline-flex items-center gap-1 rounded-full self-center; font-size:12px;font-weight:700;padding:2px 9px; }
  .trend .msym{ font-size:15px; }
  .trend.up{ color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent); }
  .trend.down{ color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,transparent); }
  .trend.flat{ color:var(--muted);background:var(--card2); }
  .divider{ height:1px;background:var(--line);margin:14px 0; }
  .archive-list{ @apply list-none m-0 p-0; }
  .archive-day{ @apply flex items-center; gap:6px;border-top:1px solid var(--line); }
  .archive-day:first-child{ border-top:none; }
  .archive-open{ @apply flex-1 flex items-center gap-3 bg-transparent border-0 text-onsurf cursor-pointer rounded-xl; text-align:left;padding:12px 8px;min-width:0; }
  .archive-open:hover{ @apply bg-s3; }
  .archive-date{ @apply flex flex-col; min-width:70px; }
  .archive-wd{ @apply text-onvar; font-size:11px; } .archive-label{ font-weight:700; }
  .archive-meta{ @apply flex-1; min-width:0; }
  .archive-kcal{ font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap; }
  .overlay{ @apply fixed inset-0 z-50 flex flex-col mx-auto; background:var(--bg);max-width:560px; }
  .overlay-head{ @apply flex items-center justify-between; padding:calc(var(--safe-top) + 12px) 16px 12px;border-bottom:1px solid var(--line); }
  .overlay-head h2{ font-size:18px;margin:0; }
  .overlay-body{ @apply flex-1 overflow-y-auto flex flex-col gap-4; padding:14px 16px calc(var(--safe-bottom) + 24px);-webkit-overflow-scrolling:touch; }
  .overlay-card{ @apply flex flex-col flex-1; min-height:0; }
  .import-cols{ @apply block bg-s1 border border-line rounded-xl text-onvar; padding:8px 10px;font-size:11px;margin:8px 0;line-height:1.6; }
  .import-text{ font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px; }
  .import-actions{ @apply flex gap-2 flex-wrap; margin-top:8px; }
  .import-warn{ border-color:var(--danger); }
  .err-list{ @apply list-none m-0 p-0 flex flex-col gap-2; font-size:13px; }
  .ellipsis{ @apply overflow-hidden; white-space:nowrap;text-overflow:ellipsis; }
  .import-success{ @apply flex items-center gap-2; font-weight:700;font-size:16px;margin:0 0 8px; }
  .import-success .msym{ color:var(--good);font-size:22px; }
  .import-submit{ width:100%; }
  .preview-meal{ margin-top:8px; }
  .preview-meal-head{ font-size:13px;font-weight:700;color:var(--accent2);margin:6px 0 2px; }
  .preview-row{ @apply flex justify-between gap-2.5; font-size:13px;padding:3px 0; }
  .preview-name{ min-width:0; } .preview-kcal{ @apply text-onvar; white-space:nowrap; }
  .toast{ @apply fixed left-1/2 rounded-lg font-semibold z-[80]; transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:12px 16px;font-size:14px;bottom:calc(var(--safe-bottom) + 76px);box-shadow:0 8px 24px rgba(0,0,0,.28); }
  .footer-note{ @apply text-center text-onvar; font-size:12px;padding:0 12px; }
  .muted{ @apply text-onvar; } .small{ font-size:12px; } .warn{ color:var(--protein); } .over{ color:var(--danger); }
}
.ring-wrap{position:relative;width:200px;height:200px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-value{font-size:44px;font-weight:800;line-height:1}.ring-value.over{color:var(--danger)}
.ring-label{color:var(--muted);font-size:13px;margin-top:4px}
.donut-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.donut-center{position:absolute;text-align:center;line-height:1.1}
.donut-center b{font-size:20px}.donut-center .muted{font-size:11px}
/* --- Balken-Zeitverlauf --- */
.bchart{display:flex;align-items:flex-start;gap:9px}
.bchart-yaxis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;height:180px;min-width:24px;font-size:10px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.bchart-main{flex:1;min-width:0}
.bchart-plot{position:relative;height:180px}
.bchart-grid{position:absolute;inset:0;pointer-events:none}
.bchart-grid i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.bchart-ref{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);opacity:.85;pointer-events:none}
.bchart-ref span{position:absolute;right:0;top:-9px;font-size:10px;font-weight:700;color:var(--accent);background:var(--card);padding:0 5px;border-radius:6px;white-space:nowrap}
.bchart-bars{position:absolute;inset:0;display:flex;align-items:flex-end}
.bchart-col{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;min-width:0}
.bchart-bar{width:62%;max-width:26px;background:var(--data);border-radius:5px 5px 2px 2px;min-height:2px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.bchart-bar.over{background:var(--danger)}
.bchart-avg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bchart-xaxis{display:flex;margin-top:7px}
.bchart-xaxis span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
/* --- Linien-Verlauf (Gewicht) --- */
.lc-plot{position:relative;height:180px}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lc-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px var(--accent);z-index:1}
.lc-xaxis{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.weight-row{display:flex;align-items:center;gap:12px}
.weight-row .num-suffix{flex:1}
.mini-spark{width:100%;display:block;margin-top:14px}
.weight-trend-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.wtrend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.wtrend .msym{font-size:17px}
.wtrend.good{color:var(--good)}.wtrend.bad{color:var(--danger)}.wtrend.flat{color:var(--muted)}
.chart-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Icon (Google Material Symbols) ---------- */
const Icon = ({name,className,style}) => (
  <span className={'msym'+(className?' '+className:'')} style={style} aria-hidden="true">{name}</span>

/* ---------- Mahlzeiten ---------- */
const MEALS={
  breakfast:{label:'Frühstück',icon:'bakery_dining',hour:8,order:0},
  lunch:{label:'Mittagessen',icon:'lunch_dining',hour:12,order:1},
  dinner:{label:'Abendessen',icon:'dinner_dining',hour:19,order:2},
  snack:{label:'Snack',icon:'cookie',hour:16,order:3},
};
const MEAL_ORDER=Object.keys(MEALS).sort((a,b)=>MEALS[a].order-MEALS[b].order);
const defaultMeal=()=>{const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h<18?'snack':'dinner';};

/* ---------- Berechnung ---------- */
const ACTIVITY = {
  sedentary:{f:1.2,label:'Sitzend – kaum Bewegung'},
  light:{f:1.375,label:'Leicht aktiv – Bürojob'},
  moderate:{f:1.55,label:'Mäßig aktiv – viel unterwegs'},
  active:{f:1.725,label:'Sehr aktiv – körperliche Arbeit'},
  very_active:{f:1.9,label:'Extrem aktiv'},
};
const bmr = p => Math.round(10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='male'?5:-161));
const maintenance = p => Math.round(bmr(p)*ACTIVITY[p.activity].f);
const dailyBudget = (p,g,ex) => Math.round(maintenance(p)+g.adjustment+(g.addExercise?ex:0));
const targetMacros = (cal,g) => ({
  protein:Math.round(cal*g.proteinPct/100/4),
  carbs:Math.round(cal*g.carbsPct/100/4),
  fat:Math.round(cal*g.fatPct/100/9),
});
const sumCal = fs => Math.round(fs.reduce((a,f)=>a+(+f.calories||0),0));
function sumNut(fs){
  const t={calories:0,protein:0,carbs:0,sugar:0,fat:0,saturatedFat:0,fiber:0,salt:0};
  fs.forEach(f=>{t.calories+=+f.calories||0;t.protein+=+f.protein||0;t.carbs+=+f.carbs||0;t.sugar+=+f.sugar||0;t.fat+=+f.fat||0;t.saturatedFat+=+f.saturatedFat||0;t.fiber+=+f.fiber||0;t.salt+=+f.salt||0;});
  return {calories:Math.round(t.calories),protein:Math.round(t.protein),carbs:Math.round(t.carbs),sugar:Math.round(t.sugar),fat:Math.round(t.fat),saturatedFat:Math.round(t.saturatedFat),fiber:Math.round(t.fiber),salt:Math.round(t.salt*10)/10};
}
const mealTotals = fs => { const o={}; MEAL_ORDER.forEach(m=>o[m]=sumNut(fs.filter(f=>f.meal===m))); return o; };
const DIET_MACROS={omnivore:{proteinPct:30,carbsPct:40,fatPct:30},vegetarian:{proteinPct:25,carbsPct:45,fatPct:30},vegan:{proteinPct:22,carbsPct:50,fatPct:28},pescetarian:{proteinPct:30,carbsPct:40,fatPct:30},lowcarb:{proteinPct:35,carbsPct:20,fatPct:45},highprotein:{proteinPct:40,carbsPct:35,fatPct:25},keto:{proteinPct:25,carbsPct:5,fatPct:70},mediterranean:{proteinPct:25,carbsPct:45,fatPct:30}};
const DIET_LABELS={omnivore:'Ausgewogen / Allesesser',vegetarian:'Vegetarisch',vegan:'Vegan',pescetarian:'Pescetarisch (mit Fisch)',lowcarb:'Low Carb',highprotein:'High Protein',keto:'Ketogen',mediterranean:'Mediterran'};
const KCAL_PER_KG=7700;
const weeklyChange = adj => Math.round((adj*7/KCAL_PER_KG)*10)/10;
function weeksToTarget(p,g){
  if(!p.targetWeight||+p.targetWeight===+p.weight)return null;
  const pw=weeklyChange(g.adjustment); if(pw===0)return null;
  const delta=(+p.targetWeight)-(+p.weight);
  if(Math.sign(delta)!==Math.sign(pw))return null;
  return Math.ceil(Math.abs(delta)/Math.abs(pw));
}

/* ---------- Datum ---------- */
const pad2 = s => String(s).padStart(2,'0');
const todayKey = (d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays = (k,n)=>{const[y,m,d]=k.split('-').map(Number);return todayKey(new Date(y,m-1,d+n));};
const dateLabel = k=>{const t=todayKey();if(k===t)return'Heute';if(k===addDays(t,-1))return'Gestern';const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});};
const weekdayShort = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short'});};
const monthLabel = k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});};
const fullDate = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const isoAt = (k,h,min=0)=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,h,min).toISOString();};
const timeLabel = iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d.getTime()))return'';try{return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
const getMonday = k=>{const[y,m,d]=k.split('-').map(Number);const dow=(new Date(y,m-1,d).getDay()+6)%7;return addDays(k,-dow);};
const uid = ()=> (crypto?.randomUUID?.() || Math.random().toString(36).slice(2));

/* ---------- Strukturierter Import ---------- */
const MEAL_ALIASES={'frühstück':'breakfast',fruehstueck:'breakfast',fruhstuck:'breakfast',breakfast:'breakfast',morgens:'breakfast',mittagessen:'lunch',mittag:'lunch',lunch:'lunch',abendessen:'dinner',abendbrot:'dinner',abend:'dinner',dinner:'dinner',snack:'snack',snacks:'snack',zwischenmahlzeit:'snack',zwischendurch:'snack',zwischen:'snack',imbiss:'snack'};
const parseMeal = raw => MEAL_ALIASES[(raw||'').trim().toLowerCase()] || 'snack';
function parseDate(raw){
  const s=(raw||'').trim();
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m)return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  return null;
}
function parseNumber(raw){
  if(raw==null)return 0; let s=String(raw).trim();
  if(!s||s==='-'||s==='–'||/^(n\/a|k\.?\s?a\.?)$/i.test(s))return 0;
  s=s.replace(/[^0-9.,-]/g,'');
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function splitRow(line){
  if(line.includes('\t'))return line.split('\t').map(c=>c.trim());
  if(line.includes('|')){let p=line.split('|').map(c=>c.trim());if(p.length&&p[0]==='')p.shift();if(p.length&&p[p.length-1]==='')p.pop();return p;}
  return line.split(/\s{2,}/).map(c=>c.trim());
}
const isSep = cells => cells.length>0 && cells.every(c=>/^:?-{2,}:?$/.test(c)||c==='');
const isHeader = cells => parseDate(cells[0]||'')===null && /datum|mahlzeit|kalorien|kcal|eiwei|protein|nahrungs/i.test(cells.join(' '));
function parseStructured(input){
  const rows=[],errors=[];
  const lines=(input||'').replace(/\r\n?/g,'\n').split('\n');
  lines.forEach((raw,i)=>{
    const lineNo=i+1, trimmed=raw.trim(); if(!trimmed)return;
    const cells=splitRow(raw);
    if(isSep(cells)||isHeader(cells))return;
    if(cells.length<5){errors.push({line:lineNo,text:trimmed,reason:'Zu wenige Spalten (mind. Datum, Mahlzeit, Name, Menge, kcal – Tab-getrennt).'});return;}
    const date=parseDate(cells[0]); if(!date){errors.push({line:lineNo,text:trimmed,reason:'Datum "'+cells[0]+'" nicht erkannt.'});return;}
    const name=(cells[2]||'').trim(); if(!name){errors.push({line:lineNo,text:trimmed,reason:'Kein Nahrungsmittel-Name.'});return;}
    const note=(cells[12]||'').trim();
    rows.push({date,meal:parseMeal(cells[1]),mealLabel:(cells[1]||'').trim()||MEALS[parseMeal(cells[1])].label,name,quantity:(cells[3]||'').trim()||undefined,calories:parseNumber(cells[4]),protein:parseNumber(cells[5]),carbs:parseNumber(cells[6]),sugar:parseNumber(cells[7]),fat:parseNumber(cells[8]),saturatedFat:parseNumber(cells[9]),fiber:parseNumber(cells[10]),salt:parseNumber(cells[11]),note:note||undefined});
  });
  return {rows,errors};
}
function sumParsed(rows){const t={calories:0,protein:0,carbs:0,sugar:0,fat:0,saturatedFat:0,fiber:0,salt:0};rows.forEach(r=>{t.calories+=r.calories;t.protein+=r.protein;t.carbs+=r.carbs;t.sugar+=r.sugar;t.fat+=r.fat;t.saturatedFat+=r.saturatedFat;t.fiber+=r.fiber;t.salt+=r.salt;});return t;}
const deNum = n => String(Math.round(n*100)/100).replace('.',',');
const deDate = k => {const[y,m,d]=k.split('-');return d+'.'+m+'.'+y;};
function serializeEntries(entries){
  return entries.map(({date,entry:e})=>[deDate(date),MEALS[e.meal].label,e.name,e.quantity||'',deNum(e.calories),deNum(e.protein),deNum(e.carbs),deNum(e.sugar),deNum(e.fat),deNum(e.saturatedFat),deNum(e.fiber),deNum(e.salt),e.note||''].join('\t')).join('\n');
}
const IMPORT_EXAMPLE=[
  '02.06.2026\tFrühstück\tNaturjoghurt\t400 g\t260\t14\t19\t19\t14\t9\t0\t0,4\tVollmilchjoghurt 3,5%',
  '02.06.2026\tFrühstück\tHimbeeren\t100 g\t52\t1\t12\t4\t1\t0\t7\t0\tfrisch',
  '02.06.2026\tFrühstück\tBrombeeren\t100 g\t43\t1\t10\t5\t0\t0\t5\t0\tfrisch',
  '02.06.2026\tSnack\tProteinriegel\t1 Stk (~50 g)\t200\t20\t18\t3\t7\t4\t2\t0,3\ttyp. Riegel ~50 g',
  '02.06.2026\tMittagessen\tChicken-Panade-Salat\t1 Portion\t550\t35\t30\t5\t30\t6\t5\t1,5\tRestaurantportion',
  '02.06.2026\tSnack\tCottage Cheese\t1 Becher (~200 g)\t200\t24\t7\t7\t9\t6\t0\t1,8\t~4% Fett',
  '02.06.2026\tSnack\tWhey-Pulver mit Wasser\t1 Portion (~30 g)\t115\t24\t3\t2\t2\t1\t0\t0,2\t1 Scoop 30 g, in Wasser',
].join('\n');

/* ---------- Persistenz ---------- */
const DEFAULTS = {
  profile:{name:'',sex:'male',age:30,height:180,weight:80,targetWeight:null,activity:'light'},
  goal:{adjustment:0,proteinPct:30,carbsPct:40,fatPct:30,addExercise:true,dietStyle:'omnivore',fiberGoal:30,sugarLimit:50,saltLimit:6,satFatLimit:20,preferences:''},
  days:{},favorites:[],weights:{},ui:{theme:'light',collapsedMeals:{}},
};
function migrateDays(days){
  const out={};
  Object.keys(days||{}).forEach(k=>{
    const d=days[k]||{};
    out[k]={date:d.date||k,exercises:d.exercises||[],foods:(d.foods||[]).map(f=>Object.assign({meal:'snack',sugar:0,saturatedFat:0,fiber:0,salt:0,source:'manual'},f))};
  });
  return out;
}
function normalizeState(p){
  p=p||{};
  return {
    profile:{...DEFAULTS.profile,...(p.profile||{})},
    goal:{...DEFAULTS.goal,...(p.goal||{})},
    days:migrateDays(p.days),
    favorites:Array.isArray(p.favorites)?p.favorites:[],
    weights:(p.weights&&typeof p.weights==='object')?p.weights:{},
    ui:{...DEFAULTS.ui,...(p.ui||{})},
  };
}
function load(){ try{const s=localStorage.getItem('essen-artifact');if(s)return normalizeState(JSON.parse(s));}catch(e){} return JSON.parse(JSON.stringify(DEFAULTS)); }
function save(s){ try{localStorage.setItem('essen-artifact',JSON.stringify(s));}catch(e){} }

/* ---------- State-Helfer ---------- */
function addFoodTo(setState,date,food){
  setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,foods:[...d.foods,{...food,id:uid(),time:food.time||new Date().toISOString()}]}}};});
}
function updateFood(setState,date,id,patch){
  setState(s=>{const d=s.days[date];if(!d)return s;return{...s,days:{...s.days,[date]:{...d,foods:d.foods.map(f=>f.id===id?{...f,...patch}:f)}}};});
}
function addExTo(setState,date,ex){
  setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,exercises:[...d.exercises,{...ex,id:uid(),time:new Date().toISOString()}]}}};});
}
function importEntries(setState,rows,replace){
  const seq={};
  const built=rows.map(r=>{const i=seq[r.date]=(seq[r.date]||0)+1;
    return {date:r.date,entry:{id:uid(),name:r.name,meal:r.meal,quantity:r.quantity,calories:Math.round(r.calories),protein:Math.round(r.protein),carbs:Math.round(r.carbs),sugar:Math.round(r.sugar),fat:Math.round(r.fat),saturatedFat:Math.round(r.saturatedFat),fiber:Math.round(r.fiber),salt:Math.round(r.salt*10)/10,note:r.note,source:'import',time:isoAt(r.date,MEALS[r.meal].hour,i)}};});
  setState(s=>{
    const days={...s.days};
    if(replace){[...new Set(rows.map(r=>r.date))].forEach(dt=>{const d=days[dt]||{date:dt,foods:[],exercises:[]};days[dt]={...d,foods:[]};});}
    built.forEach(({date,entry})=>{const d=days[date]||{date,foods:[],exercises:[]};days[date]={...d,foods:[...d.foods,entry]};});
    return {...s,days};
  });
  return built.map(b=>({date:b.date,id:b.entry.id}));
}
function removeRefs(setState,refs){
  setState(s=>{const days={...s.days};const by={};refs.forEach(r=>{(by[r.date]=by[r.date]||new Set()).add(r.id);});Object.keys(by).forEach(dt=>{const d=days[dt];if(d)days[dt]={...d,foods:d.foods.filter(f=>!by[dt].has(f.id))};});return{...s,days};});
}
function copyDay(setState,from,to){
  setState(s=>{const src=s.days[from];if(!src||!src.foods.length)return s;const seq={};
    const add=src.foods.map(f=>{const i=seq[to]=(seq[to]||0)+1;return {...f,id:uid(),time:isoAt(to,(MEALS[f.meal]||MEALS.snack).hour,i),source:'manual'};});
    const d=s.days[to]||{date:to,foods:[],exercises:[]};return {...s,days:{...s.days,[to]:{...d,foods:[...d.foods,...add]}}};});
}
function setWeight(setState,date,kg){
  setState(s=>{const weights={...s.weights};
    if(kg==null||isNaN(kg)||kg<=0)delete weights[date];else weights[date]=Math.round(kg*10)/10;
    const keys=Object.keys(weights).sort();const latest=keys.length?weights[keys[keys.length-1]]:s.profile.weight;
    return {...s,weights,profile:{...s.profile,weight:latest}};});
}

/* ---------- UI-Bausteine ---------- */
function Ring({consumed,budget}){
  const size=200,stroke=18,r=(size-stroke)/2,c=2*Math.PI*r;
  const frac=budget>0?Math.min(consumed/budget,1):0, over=consumed>budget, rem=budget-consumed;
  return (
    <div className="ring-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={over?'var(--danger)':'var(--accent)'} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-frac)} transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <div className="ring-center">
        <div className={'ring-value'+(over?' over':'')}>{Math.abs(rem)}</div>
        <div className="ring-label">{over?'kcal drüber':'kcal übrig'}</div>
      </div>
    </div>
  );
}
const MacroBar=({label,value,target,color,unit='g',limit=false})=>{
  const frac=target>0?Math.min(value/target,1):0, over=target>0&&value>target, fill=limit&&over?'var(--danger)':color;
  return (
    <div className="macro">
      <div className="macro-head"><span className="macro-label">{label}</span>
        <span className="macro-num">{value}<span className="muted"> {limit?'max.':'/'} {target} {unit}</span>{limit&&over&&<span className="warn-tag"><Icon name="warning"/></span>}</span></div>
      <div className="bar"><div className="bar-fill" style={{width:frac*100+'%',background:fill}}/></div>
    </div>
  );
};
function Donut({segments,size=116,stroke=16,center}){
  const r=(size-stroke)/2,c=2*Math.PI*r; const total=segments.reduce((a,s)=>a+s.value,0)||1; let acc=0;
  return (<div className="donut-wrap" style={{width:size,height:size}}>
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke}/>
      {segments.map((s,i)=>{const dash=(s.value/total)*c;const el=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color} strokeWidth={stroke} strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-acc} transform={`rotate(-90 ${size/2} ${size/2})`}/>;acc+=dash;return el;})}

function niceMax(v){ if(v<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=1.5?1.5:n<=2?2:n<=3?3:n<=5?5:n<=7?7:10; return s*p; }
const fmtK=v=>v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v));
const DayBars=({data,unit='',color='var(--data)',avg,refLabel='Budget'})=>{

  const n=data.length;

};
function LineChart({points,target,unit='kg'}){
  const idx=points.map((p,i)=>({v:p.value,k:p.key,i})).filter(p=>p.v!=null);
  if(!idx.length)return null;
  const vals=idx.map(p=>p.v);
  const n=points.length;
  const extra=target!=null?[+target]:[];
  let lo=Math.min(...vals,...extra),hi=Math.max(...vals,...extra);
  if(lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.2;lo-=pad;hi+=pad;
  const PADX=4;
  const xP=i=>n<=1?50:PADX+(i/(n-1))*(100-2*PADX);
  const yP=v=>(1-(v-lo)/(hi-lo))*100;
  const line=idx.map(p=>`${xP(p.i).toFixed(2)},${yP(p.v).toFixed(2)}`).join(' ');
  const area=idx.length>=2?`${xP(idx[0].i).toFixed(2)},100 ${line} ${xP(idx[idx.length-1].i).toFixed(2)},100`:null;
  const ty=target!=null?yP(+target):null;
  const fmt=k=>{const[,m,d]=k.split('-');return d+'.'+m+'.';};
  return (<div className="lc">
    <div className="lc-plot">
      <svg className="lc-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs><linearGradient id="lcgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--accent)" stopOpacity="0.24"/><stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/></linearGradient></defs>
        {[20,40,60,80].map(y=><line key={y} x1="0" y1={y} x2="100" y2={y} stroke="var(--line)" strokeWidth="1" vectorEffect="non-scaling-stroke"/>)}
        {area&&<polygon points={area} fill="url(#lcgrad)"/>}
        {ty!=null&&ty>=-1&&ty<=101&&<line x1="0" y1={ty} x2="100" y2={ty} stroke="var(--accent)" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.75" vectorEffect="non-scaling-stroke"/>}
        {idx.length>=2&&<polyline points={line} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke"/>}
      </svg>
      {idx.map(p=><span key={p.i} className="lc-dot" style={{left:xP(p.i)+'%',top:yP(p.v)+'%'}} title={p.k+': '+p.v+' '+unit}/>)}
    </div>
    <div className="lc-xaxis"><span>{fmt(idx[0].k)}</span>{idx.length>1&&<span>{fmt(idx[idx.length-1].k)}</span>}</div>
    <div className="chart-legend" style={{marginTop:8}}>
      <span>min {Math.round(Math.min(...vals)*10)/10} {unit}</span>
      <span>max {Math.round(Math.max(...vals)*10)/10} {unit}</span>
      {target!=null&&<span><i className="sw line"/> Ziel {target} {unit}</span>}
    </div>
  </div>);
}
function MiniSpark({data,height=46}){
  const vals=data.map(d=>d.value);
  if(vals.length<2)return null;
  let lo=Math.min(...vals),hi=Math.max(...vals); if(lo===hi){lo-=0.5;hi+=0.5;}
  const pad=(hi-lo)*0.25;lo-=pad;hi+=pad;
  const n=data.length;
  const pts=data.map((d,i)=>`${(i/(n-1)*100).toFixed(1)},${((1-(d.value-lo)/(hi-lo))*100).toFixed(1)}`);

/* ---------- Tages-Übersicht für Claude ---------- */
function buildDaySummary(state,date){
  const {profile,goal}=state;
  const day=state.days[date]||{date,foods:[],exercises:[]};
  const t=sumNut(day.foods);
  const burned=Math.round(day.exercises.reduce((a,e)=>a+(+e.calories||0),0));
  const budget=dailyBudget(profile,goal,burned);
  const tgt=targetMacros(budget,goal);
  const rest=budget-t.calories;
  const modeLabel=goal.adjustment<0?'Abnehmen':goal.adjustment>0?'Aufbauen':'Halten';
  const L=[];
  L.push('Ernährungs-Tagesübersicht – '+fullDate(date));
  L.push('');
  L.push('Ziel: '+modeLabel+' · Tagesbudget '+budget+' kcal (Erhaltung '+maintenance(profile)+(goal.adjustment?', Anpassung '+(goal.adjustment>0?'+':'')+goal.adjustment:'')+') · Stil: '+DIET_LABELS[goal.dietStyle]);
  L.push('Profil: '+(profile.sex==='male'?'m':'w')+', '+profile.age+' J, '+profile.height+' cm, '+profile.weight+' kg'+(profile.targetWeight?' (Ziel '+profile.targetWeight+' kg)':''));
  if((goal.preferences||'').trim()) L.push('Vorlieben/Hinweise: '+goal.preferences.trim());
  L.push('');
  L.push('Gegessen: '+t.calories+' / '+budget+' kcal (Rest '+rest+')'+(burned?' · Sport +'+burned+' kcal':''));
  L.push('Makros: Eiweiß '+t.protein+'/'+tgt.protein+' g · KH '+t.carbs+'/'+tgt.carbs+' g · Fett '+t.fat+'/'+tgt.fat+' g');
  L.push('Weiteres: Ballaststoffe '+t.fiber+'/'+goal.fiberGoal+' g · Zucker '+t.sugar+' (max '+goal.sugarLimit+') · ges. FS '+t.saturatedFat+' (max '+goal.satFatLimit+') · Salz '+t.salt+' (max '+goal.saltLimit+') g');
  MEAL_ORDER.forEach(m=>{
    const items=day.foods.filter(f=>f.meal===m); if(!items.length)return;
    L.push('');
    L.push(MEALS[m].icon+' '+MEALS[m].label+' ('+sumCal(items)+' kcal)');
    items.forEach(f=>L.push('- '+f.name+(f.quantity?', '+f.quantity:'')+' — '+Math.round(f.calories)+' kcal (E'+f.protein+'/KH'+f.carbs+'/F'+f.fat+')'+(f.note?' · '+f.note:'')));
  });
  if(day.exercises.length){
    L.push('');
    L.push('Sport: '+day.exercises.map(e=>e.name+(e.durationMin?' '+e.durationMin+' min':'')+' (−'+Math.round(e.calories)+' kcal)').join(', '));
  }
  if(state.weights[date]!=null) L.push('Gewicht: '+state.weights[date]+' kg');
  if(!day.foods.length) L.push('\n(An diesem Tag wurde noch nichts erfasst.)');
  L.push('');
  L.push('---');
  L.push('Das ist meine Ernährung an diesem Tag. Bitte gib mir kurzes, konkretes Feedback (Makro-Balance, Kalorienziel, was ich verbessern könnte).');
  return L.join('\n');
}
function DayShareOverlay({state,date,onClose}){

function ImportPanel({state,setState,setDate,onClose}){
  const [text,setText]=useState('');
  const [replace,setReplace]=useState(false);
  const [done,setDone]=useState(null);
  const result=useMemo(()=>parseStructured(text),[text]);
  const totals=useMemo(()=>sumParsed(result.rows),[result.rows]);
  const dupCount=useMemo(()=>result.rows.filter(r=>(state.days[r.date]&&state.days[r.date].foods||[]).some(f=>f.name===r.name&&f.meal===r.meal&&Math.round(f.calories)===Math.round(r.calories))).length,[result.rows,state.days]);
  const byDate=useMemo(()=>{const map=new Map();result.rows.forEach(r=>{if(!map.has(r.date))map.set(r.date,[]);map.get(r.date).push(r);});return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));},[result.rows]);

  function doImport(){
    if(!result.rows.length)return;
    const refs=importEntries(setState,result.rows,replace);
    const first=[...new Set(result.rows.map(r=>r.date))].sort()[0]; if(first)setDate(first);
    setDone({added:result.rows.length,days:new Set(result.rows.map(r=>r.date)).size,refs});

    <Overlay title="Strukturiert importieren" onClose={onClose}>

      </div>

      {result.errors.length>0 && (

          <Stat label="Einträge" value={result.rows.length}/>

      {!result.rows.length && !result.errors.length && text.trim()==='' &&

  const day=state.days[date]||{date,foods:[],exercises:[]};
  const totals=sumNut(day.foods), consumed=totals.calories;
  const burned=Math.round(day.exercises.reduce((a,e)=>a+(+e.calories||0),0));
  const budget=dailyBudget(profile,goal,burned), target=targetMacros(budget,goal);
  const [pick,setPick]=useState(false),[share,setShare]=useState(false);
  const [wInput,setWInput]=useState(n2s(state.weights[date]));
  useEffect(()=>{setWInput(n2s(state.weights[date]));},[date,state.weights]);
  const wKeys=Object.keys(state.weights).filter(k=>state.weights[k]!=null).sort();
  const wRecent=wKeys.slice(-14).map(k=>({key:k,value:state.weights[k]}));
  const wLast=wKeys.length?state.weights[wKeys[wKeys.length-1]]:null;
  const wDelta=wRecent.length>=2?Math.round((wRecent[wRecent.length-1].value-wRecent[0].value)*10)/10:null;
  let wGood=null;
  if(profile.targetWeight!=null&&wDelta!=null&&wDelta!==0){const needDown=profile.targetWeight<wLast;wGood=needDown?wDelta<0:wDelta>0;}
  const macroSegs=[{value:totals.protein*4,color:'var(--protein)'},{value:totals.carbs*4,color:'var(--carbs)'},{value:totals.fat*9,color:'var(--fat)'}];
  return (
    <div className="page page-dash">
      <header className="datebar">
        <button className="nav-btn" aria-label="Vorheriger Tag" onClick={()=>setDate(addDays(date,-1))}><Icon name="chevron_left"/></button>
        {pick
          ? <input type="date" className="date-input" autoFocus value={date} max={todayKey()} onChange={e=>{if(e.target.value)setDate(e.target.value);}} onBlur={()=>setPick(false)}/>
          : <button className="datebar-label" onClick={()=>setPick(true)} title="Datum wählen">{dateLabel(date)} <Icon name="expand_more"/></button>}
        <button className="nav-btn" aria-label="Nächster Tag" onClick={()=>setDate(addDays(date,1))} disabled={date>=todayKey()}><Icon name="chevron_right"/></button>
      </header>
      <div className="toolbar">
        <button className="chip" onClick={()=>setShare(true)}><Icon name="smart_toy"/> Für Claude kopieren</button>
        <button className="chip" onClick={openImport}><Icon name="content_paste"/> Import</button>
      </div>
      <div className="cols">
      <div className="col">
      <section className="card hero">
        <Ring consumed={consumed} budget={budget}/>
        <div className="hero-stats">
          <Stat label="Budget" value={budget} sub="kcal"/>
          <Stat label="Gegessen" value={consumed} sub="kcal"/>
          <Stat label="Sport" value={'+'+burned} sub="kcal"/>
        </div>
      </section>
      <section className="card">
        <h3 className="card-title">Makronährstoffe</h3>
        <div className="macro-top">
          <Donut segments={macroSegs} center={<div><b>{consumed}</b><div className="muted">kcal</div></div>}/>
          <div className="bars">
            <MacroBar label="Eiweiß" value={totals.protein} target={target.protein} color="var(--protein)"/>
            <MacroBar label="Kohlenhydrate" value={totals.carbs} target={target.carbs} color="var(--carbs)"/>
            <MacroBar label="Fett" value={totals.fat} target={target.fat} color="var(--fat)"/>
          </div>
        </div>
      </section>
      </div>
      <div className="col">
      <section className="card">
        <h3 className="card-title">Weitere Nährwerte</h3>
        <MacroBar label="Ballaststoffe" value={totals.fiber} target={goal.fiberGoal} color="var(--fiber)"/>
        <MacroBar label="Zucker" value={totals.sugar} target={goal.sugarLimit} color="var(--sugar)" limit/>
        <MacroBar label="ges. Fettsäuren" value={totals.saturatedFat} target={goal.satFatLimit} color="var(--satfat)" limit/>
        <MacroBar label="Salz" value={totals.salt} target={goal.saltLimit} color="var(--salt)" limit/>
      </section>
      <section className="card">
        <div className="energy-row"><span>Grundumsatz</span><strong>{bmr(profile)} kcal</strong></div>
        <div className="energy-row"><span>+ Alltag (Erhaltung)</span><strong>{maintenance(profile)} kcal</strong></div>
        <div className="energy-row"><span>+ Sportumsatz heute</span><strong>{burned} kcal</strong></div>
        <div className="energy-row"><span>± Ziel-Anpassung</span><strong>{goal.adjustment>0?'+':''}{goal.adjustment} kcal</strong></div>
        <div className="energy-row total"><span>= Tagesbudget</span><strong>{budget} kcal</strong></div>
      </section>
      <section className="card">
        <h3 className="card-title"><Icon name="monitor_weight"/> Gewicht</h3>
        <div className="weight-row">
          <div className="num-suffix"><input inputMode="decimal" placeholder="–" value={wInput} onChange={e=>setWInput(e.target.value)}
            onBlur={()=>setWeight(setState,date,wInput.trim()===''?null:numDe(wInput))}
            onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/><span>kg</span></div>
          {profile.targetWeight!=null && <span className="muted small">Ziel {profile.targetWeight} kg</span>}
        </div>
        {wRecent.length>=2 && <div className="weight-trend">
          <MiniSpark data={wRecent}/>
          <div className="weight-trend-row">
            <span className="muted small">{wRecent.length} Messungen · zuletzt {wLast} kg</span>
            <span className={'wtrend '+(wGood===true?'good':wGood===false?'bad':'flat')}><Icon name={wDelta<0?'trending_down':wDelta>0?'trending_up':'trending_flat'}/> {wDelta>0?'+':''}{wDelta} kg</span>
          </div>
        </div>}
        {wRecent.length<2 && wLast!=null && <p className="muted small" style={{margin:'10px 0 0'}}>Trag an mehreren Tagen dein Gewicht ein – der Verlauf erscheint hier und in der Analyse.</p>}
      </section>
      </div>
      </div>
      {share && <DayShareOverlay state={state} date={date} onClose={()=>setShare(false)}/>}
    </div>
  );
}

function Today({state,setState,date,setDate,openImport,notify}){
  const day=state.days[date]||{date,foods:[],exercises:[]};
  const [openF,setOpenF]=useState(false),[openE,setOpenE]=useState(false),[editId,setEditId]=useState(null),[pick,setPick]=useState(false),[share,setShare]=useState(false);
  const rmFood=id=>setState(s=>{const d=s.days[date];if(!d)return s;return{...s,days:{...s.days,[date]:{...d,foods:d.foods.filter(x=>x.id!==id)}}};});
  const rmEx=id=>setState(s=>{const d=s.days[date];if(!d)return s;return{...s,days:{...s.days,[date]:{...d,exercises:d.exercises.filter(x=>x.id!==id)}}};});
  const collapsedMeals=(state.ui&&state.ui.collapsedMeals)||{};
  const toggleMeal=m=>setState(s=>{const cm={...((s.ui&&s.ui.collapsedMeals)||{})};cm[m]=!cm[m];return{...s,ui:{...s.ui,collapsedMeals:cm}};});
  const prev=addDays(date,-1); const prevHas=(state.days[prev]&&state.days[prev].foods.length)>0;
  return (
    <div className="page">
      <header className="datebar">
        <button className="nav-btn" aria-label="Vorheriger Tag" onClick={()=>setDate(addDays(date,-1))}><Icon name="chevron_left"/></button>
        {pick
          ? <input type="date" className="date-input" autoFocus value={date} max={todayKey()} onChange={e=>{if(e.target.value)setDate(e.target.value);}} onBlur={()=>setPick(false)}/>
          : <button className="datebar-label" onClick={()=>setPick(true)} title="Datum wählen">{dateLabel(date)} <Icon name="expand_more"/></button>}
        <button className="nav-btn" aria-label="Nächster Tag" onClick={()=>setDate(addDays(date,1))} disabled={date>=todayKey()}><Icon name="chevron_right"/></button>
      </header>
      <div className="toolbar">
        {prevHas && <button className="chip" onClick={()=>{copyDay(setState,prev,date);notify('Mahlzeiten von gestern übernommen');}}><Icon name="library_add"/> Gestern übernehmen</button>}
        <button className="chip" onClick={()=>setShare(true)}><Icon name="smart_toy"/> Für Claude</button>
        <button className="chip" onClick={()=>window.print()}><Icon name="print"/> Drucken</button>
      </div>

      <button className="erfassen-btn" onClick={openImport}><Icon name="add"/> Mahlzeit erfassen</button>

      <section className="card">
        <div className="section-head"><h3 className="card-title">Mahlzeiten</h3>
          <div className="section-actions">
            <button className="chip" onClick={()=>{setEditId(null);setOpenF(o=>!o);}}>{openF?<Icon name="close"/>:<><Icon name="add"/> manuell</>}</button>
          </div></div>
        {openF && <FoodForm onSubmit={f=>{addFoodTo(setState,date,f);setOpenF(false);notify('Eingetragen: '+f.name);}}/>}
        {day.foods.length===0 && !openF && <p className="empty">Noch nichts erfasst. Tippe auf „＋ Mahlzeit erfassen" (Tabelle einfügen) oder „+ manuell".</p>}
        {MEAL_ORDER.map(meal=>{
          const items=day.foods.filter(f=>f.meal===meal); if(!items.length)return null;
          const isColl=!!collapsedMeals[meal];
          return (<div className={'meal-group'+(isColl?' collapsed':'')} key={meal}>
            <button className="meal-head" onClick={()=>toggleMeal(meal)} aria-expanded={!isColl}>
              <span className="meal-title"><Icon name={MEALS[meal].icon}/> {MEALS[meal].label}{isColl&&<span className="meal-count">{items.length}</span>}</span>
              <span className="meal-head-right"><span className="meal-kcal">{sumCal(items)} kcal</span><Icon name="expand_more" className="meal-chevron"/></span></button>
            {!isColl && <ul className="entries">{items.map(f=> editId===f.id
              ? (<li key={f.id}><FoodForm initial={f} submitLabel="Speichern" onSubmit={data=>{updateFood(setState,date,f.id,data);setEditId(null);}}/></li>)
              : (
              <li className="entry" key={f.id}>
                <div className="entry-main"><span className="entry-name">{f.name}</span>
                  {f.quantity&&<span className="entry-qty">{f.quantity}</span>}
                  <span className="entry-macros">E {f.protein} · KH {f.carbs} · F {f.fat} g{f.fiber?(' · Bst '+f.fiber+' g'):''}{f.source!=='import'&&timeLabel(f.time)?(' · '+timeLabel(f.time)):''}</span>
                  {f.note&&<span className="entry-note">{f.note}</span>}</div>
                <div className="entry-kcal">{Math.round(f.calories)}</div>
                <div className="entry-actions">
                  <button className="icon-btn" title="Bearbeiten" onClick={()=>{setOpenF(false);setEditId(f.id);}}><Icon name="edit"/></button>
                  <button className="del" title="Löschen" onClick={()=>rmFood(f.id)}><Icon name="close"/></button>
                </div>
              </li>))}</ul>}
          </div>);
        })}
      </section>

      <section className="card">
        <div className="section-head"><h3 className="card-title">Sport</h3>
          <div className="section-actions"><button className="chip" onClick={()=>setOpenE(o=>!o)}>{openE?<Icon name="close"/>:<><Icon name="add"/> erfassen</>}</button></div></div>
        {openE && <ExerciseForm onSubmit={e=>{addExTo(setState,date,e);setOpenE(false);}}/>}
        {day.exercises.length===0 && !openE && <p className="empty">Noch kein Sport erfasst.</p>}
        <ul className="entries">{day.exercises.map(e=>(
          <li className="entry" key={e.id}>
            <div className="entry-main"><span className="entry-name">{e.name}</span>
              <span className="entry-macros">{e.durationMin?e.durationMin+' min · ':''}{timeLabel(e.time)}</span></div>
            <div className="entry-kcal burn">−{Math.round(e.calories)}</div>
            <button className="del" onClick={()=>rmEx(e.id)}><Icon name="close"/></button>
          </li>))}</ul>
      </section>
      {share && <DayShareOverlay state={state} date={date} onClose={()=>setShare(false)}/>}
    </div>
  );
}

/* ---------- Auswertung ---------- */
const METRICS=[{id:'calories',label:'Kalorien',unit:' kcal'},{id:'protein',label:'Eiweiß',unit:' g'},{id:'carbs',label:'KH',unit:' g'},{id:'fat',label:'Fett',unit:' g'},{id:'fiber',label:'Ballaststoffe',unit:' g'},{id:'sugar',label:'Zucker',unit:' g'},{id:'salt',label:'Salz',unit:' g'}];
const METRIC_COLOR={calories:'var(--data)',protein:'var(--protein)',carbs:'var(--carbs)',fat:'var(--fat)',fiber:'var(--fiber)',sugar:'var(--sugar)',salt:'var(--salt)'};
const avgArr = arr => arr.length?Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10:0;
function Stats({state,setDate,goToToday}){
  const {profile,goal,days,weights}=state;
  const [range,setRange]=useState(7);
  const [metric,setMetric]=useState('calories');
  const today=todayKey();
  const rows=useMemo(()=>{
    const keys=[]; for(let i=range-1;i>=0;i--)keys.push(addDays(today,-i));
    return keys.map(k=>{const d=days[k]||{foods:[],exercises:[]};const burned=Math.round(d.exercises.reduce((a,e)=>a+(+e.calories||0),0));
      return {key:k,budget:dailyBudget(profile,goal,burned),totals:sumNut(d.foods),target:targetMacros(dailyBudget(profile,goal,burned),goal),meals:mealTotals(d.foods),has:d.foods.length>0};});
  },[days,profile,goal,range,today]);
  const tracked=rows.filter(r=>r.has);

  const chartData=rows.map(r=>{
    let value=0,ref=undefined,over=false;
    if(metric==='calories'){value=r.totals.calories;ref=r.budget;over=value>r.budget;}
    else if(metric==='protein'){value=r.totals.protein;ref=r.target.protein;}
    else if(metric==='carbs'){value=r.totals.carbs;ref=r.target.carbs;}
    else if(metric==='fat'){value=r.totals.fat;ref=r.target.fat;}
    else if(metric==='fiber'){value=r.totals.fiber;ref=goal.fiberGoal;}
    else if(metric==='sugar'){value=r.totals.sugar;ref=goal.sugarLimit;over=value>goal.sugarLimit;}
    else if(metric==='salt'){value=r.totals.salt;ref=goal.saltLimit;over=value>goal.saltLimit;}
    return {key:r.key,value,ref,over};
  });
  const mInfo=METRICS.find(m=>m.id===metric);
  const tVals=chartData.map((d,i)=>rows[i].has?d.value:null);
  const present=tVals.filter(v=>v!=null);
  const mAvg=avgArr(present);
  const avgLine=tVals.map((_,i)=>{let s=0,c=0;for(let j=Math.max(0,i-6);j<=i;j++){if(tVals[j]!=null){s+=tVals[j];c++;}}return c?Math.round((s/c)*10)/10:null;});
  const half=Math.floor(present.length/2);
  const trend=present.length>=4?avgArr(present.slice(half))-avgArr(present.slice(0,half)):0;

  const avgTotals={calories:avgArr(tracked.map(r=>r.totals.calories)),protein:avgArr(tracked.map(r=>r.totals.protein)),carbs:avgArr(tracked.map(r=>r.totals.carbs)),sugar:avgArr(tracked.map(r=>r.totals.sugar)),fat:avgArr(tracked.map(r=>r.totals.fat)),saturatedFat:avgArr(tracked.map(r=>r.totals.saturatedFat)),fiber:avgArr(tracked.map(r=>r.totals.fiber)),salt:avgArr(tracked.map(r=>r.totals.salt))};
  const avgBudget=Math.round(avgArr(rows.map(r=>r.budget)));
  const avgTarget=targetMacros(avgBudget,goal);
  const mealAvg=MEAL_ORDER.map(meal=>({meal,kcal:avgArr(tracked.map(r=>r.meals[meal].calories))}));
  const mealMax=Math.max(...mealAvg.map(m=>m.kcal),1);
  const withinBudget=tracked.filter(r=>r.totals.calories<=r.budget).length;
  const avgDev=tracked.length?Math.round(avgArr(tracked.map(r=>r.totals.calories-r.budget))):0;
  const balance=tracked.reduce((a,r)=>a+(r.totals.calories-r.budget),0);
  const balKg=Math.round(balance/KCAL_PER_KG*100)/100;
  let streak=0; for(let i=0;;i++){const k=addDays(today,-i);if((days[k]&&days[k].foods.length)>0)streak++;else break;}

  const wpts=rows.map(r=>({key:r.key,value:weights[r.key]!=null?weights[r.key]:null}));
  const wPresent=wpts.filter(p=>p.value!=null);
  const wChange=wPresent.length>=2?Math.round((wPresent[wPresent.length-1].value-wPresent[0].value)*10)/10:null;

  const shortDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});};
  const weeklyKg=Math.round((avgDev*7/KCAL_PER_KG)*100)/100;
  const proj4=Math.round((profile.weight+weeklyKg*4)*10)/10;
  let etaWeeks=null,etaDate=null;
  if(profile.targetWeight!=null && weeklyKg!==0){const delta=profile.targetWeight-profile.weight;if(Math.sign(delta)===Math.sign(weeklyKg)){etaWeeks=Math.ceil(Math.abs(delta)/Math.abs(weeklyKg));etaDate=shortDate(addDays(today,etaWeeks*7));}}
  const enoughForProg=tracked.length>=3;

  return (
    <div className="page">
      <header className="chat-head"><h2>Auswertung</h2>
        <div className="seg">{[7,14,30,90].map(r=>(<button key={r} className={range===r?'on':''} onClick={()=>setRange(r)}>{r} T</button>))}</div></header>

      <div className="tiles">
        <Stat label="Ø Kalorien" value={avgTotals.calories} sub="kcal/Tag"/>
        <Stat label="Ø Abweichung" value={(avgDev>0?'+':'')+avgDev} sub="kcal/Tag"/>
        <Stat label="Im Budget" value={withinBudget+' / '+(tracked.length||0)}/>
        <Stat label="Erfasste Tage" value={tracked.length+' / '+range}/>
        <Stat label={<><Icon name="local_fire_department"/> Serie</>} value={streak} sub={streak===1?'Tag':'Tage'}/>
      </div>

      {tracked.length===0 && <p className="empty">Noch keine Daten im Zeitraum. Importiere oder erfasse Mahlzeiten.</p>}

      <section className="card">
        <div className="section-head"><h3 className="card-title">Zeitverlauf</h3>
          {tracked.length>0 && <div className="kpi"><span className="kpi-big" style={{color:METRIC_COLOR[metric]}}>{mAvg}</span><span className="kpi-unit">{mInfo.unit.trim()} Ø</span>{present.length>=4 && <span className={'trend '+(trend>0?'up':trend<0?'down':'flat')}>{trend>0?<><Icon name="trending_up"/> steigend</>:trend<0?<><Icon name="trending_down"/> fallend</>:<><Icon name="trending_flat"/> stabil</>}</span>}</div>}
        </div>
        <div className="metric-chips">{METRICS.map(m=>(<button key={m.id} className={'metric-chip'+(metric===m.id?' on':'')} onClick={()=>setMetric(m.id)}>{m.label}</button>))}</div>
        <DayBars data={chartData} unit={mInfo.unit} color={METRIC_COLOR[metric]} avg={avgLine}/>
        <div className="chart-legend"><span><i className="sw" style={{background:METRIC_COLOR[metric]}}/> Wert</span><span><i className="sw line"/> Ziel/Budget</span><span><i className="sw avgline"/> Ø 7 T</span><span><i className="sw danger"/> über Ziel</span></div>
      </section>

      <section className="card">
        <h3 className="card-title"><Icon name="auto_graph"/> Prognose</h3>
        {!enoughForProg
          ? <p className="empty">Noch zu wenig erfasste Tage ({tracked.length}) – ab ca. 3 Tagen gibt es eine Schätzung.</p>
          : (<>
            <div className="kpi"><span className="kpi-big" style={{color:weeklyKg<0?'var(--good)':weeklyKg>0?'var(--danger)':'var(--muted)'}}>{weeklyKg>0?'+':''}{weeklyKg}</span><span className="kpi-unit">kg / Woche</span></div>
            <p className="lede" style={{marginTop:8}}>Bei aktuellem Schnitt: <strong>{avgDev>0?'+':''}{avgDev} kcal/Tag</strong> {avgDev<0?'Defizit':avgDev>0?'Überschuss':'auf Budget'}.</p>
            <div className="divider"/>
            <div className="energy-row"><span>Gewicht in 4 Wochen ≈</span><strong>{proj4} kg</strong></div>
            {etaWeeks!=null
              ? <div className="energy-row total"><span>Ziel {profile.targetWeight} kg voraussichtlich</span><strong>~{etaWeeks} Wo · {etaDate}</strong></div>
              : (profile.targetWeight!=null
                  ? <p className="muted small" style={{margin:'8px 0 0'}}>Mit dem aktuellen Trend wird {profile.targetWeight} kg nicht angesteuert – Ziel oder Defizit im Profil prüfen.</p>
                  : <p className="muted small" style={{margin:'8px 0 0'}}>Setz im Profil ein Wunschgewicht für eine Zieldatum-Schätzung.</p>)}
            <p className="muted small" style={{margin:'10px 0 0'}}>Schätzung auf Basis der Kalorienbilanz (≈ {KCAL_PER_KG} kcal/kg) – keine medizinische Beratung.</p>
          </>)}
      </section>

      {wPresent.length>0
        ? (<div className="grid2">
            <section className="card">
              <h3 className="card-title"><Icon name="monitor_weight"/> Gewichtsverlauf</h3>
              <LineChart points={wpts} target={profile.targetWeight}/>
              <div className="avg-row" style={{marginTop:8}}><span>Aktuell{wChange!=null&&<span className="muted small"> {wChange>0?'+':''}{wChange} kg im Zeitraum</span>}</span><strong>{wPresent[wPresent.length-1].value} kg</strong></div>
            </section>
            <section className="card">
              <h3 className="card-title"><Icon name="calendar_month"/> Kalender</h3>
              <Heatmap days={days} profile={profile} goal={goal} onPick={k=>{setDate(k);goToToday();}}/>
            </section>
          </div>)
        : (<section className="card">
            <h3 className="card-title"><Icon name="calendar_month"/> Kalender</h3>
            <Heatmap days={days} profile={profile} goal={goal} onPick={k=>{setDate(k);goToToday();}}/>
          </section>)}

      <div className="grid2">
        <section className="card">
          <h3 className="card-title">Ø Makronährstoffe</h3>
          <MacroBar label="Eiweiß" value={avgTotals.protein} target={avgTarget.protein} color="var(--protein)"/>
          <MacroBar label="Kohlenhydrate" value={avgTotals.carbs} target={avgTarget.carbs} color="var(--carbs)"/>
          <MacroBar label="Fett" value={avgTotals.fat} target={avgTarget.fat} color="var(--fat)"/>
        </section>
        <section className="card">
          <h3 className="card-title">Ø weitere Nährwerte</h3>
          <MacroBar label="Ballaststoffe" value={avgTotals.fiber} target={goal.fiberGoal} color="var(--fiber)"/>
          <MacroBar label="Zucker" value={avgTotals.sugar} target={goal.sugarLimit} color="var(--sugar)" limit/>
          <MacroBar label="ges. Fettsäuren" value={avgTotals.saturatedFat} target={goal.satFatLimit} color="var(--satfat)" limit/>
          <MacroBar label="Salz" value={avgTotals.salt} target={goal.saltLimit} color="var(--salt)" limit/>
        </section>
      </div>

      <section className="card">
        <h3 className="card-title">Ø Kalorien nach Mahlzeit</h3>
        {mealAvg.map(m=>(
          <div className="macro" key={m.meal}>
            <div className="macro-head"><span className="macro-label">{MEALS[m.meal].icon} {MEALS[m.meal].label}</span><span className="macro-num">{m.kcal} kcal</span></div>
            <div className="bar"><div className="bar-fill" style={{width:(m.kcal/mealMax)*100+'%',background:'var(--data)'}}/></div>
          </div>))}
      </section>
    </div>
  );
}

/* ---------- Archiv (im Profil eingebettet) ---------- */
function ArchiveSection({state,setState,goDay}){
  const {profile,goal,days}=state;
  const [showExport,setShowExport]=useState(false);
  const [q,setQ]=useState('');
  const dayList=useMemo(()=>Object.values(days).filter(d=>d.foods.length>0||d.exercises.length>0).sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{
    const totals=sumNut(d.foods); const burned=Math.round(d.exercises.reduce((a,e)=>a+(+e.calories||0),0)); const budget=dailyBudget(profile,goal,burned);
    return {...d,totals,budget,over:totals.calories>budget};
  }),[days,profile,goal]);
  const ql=q.trim().toLowerCase();
  const filtered=ql?dayList.filter(d=>d.foods.some(f=>f.name.toLowerCase().includes(ql))):dayList;
  const groups=useMemo(()=>{const map=new Map();filtered.forEach(d=>{const l=monthLabel(d.date);if(!map.has(l))map.set(l,[]);map.get(l).push(d);});return [...map.entries()];},[filtered]);
  const totalDays=dayList.length, totalEntries=dayList.reduce((a,d)=>a+d.foods.length,0);
  const del=date=>{if(confirm('Tag '+dateLabel(date)+' wirklich aus dem Archiv löschen?'))setState(s=>{const ds={...s.days};delete ds[date];return{...s,days:ds};});};
  return (
    <section className="card">
      <div className="section-head"><h3 className="card-title"><Icon name="inventory_2"/> Archiv{totalDays?(' · '+totalDays+(totalDays===1?' Tag':' Tage')):''}</h3>
        <div className="section-actions">{totalEntries>0 && <button className="chip" onClick={()=>setShowExport(true)}><Icon name="download"/> Export</button>}</div></div>
      {totalDays===0 && <p className="empty" style={{margin:0}}>Noch keine Tage. Importiere deine Tabelle oder erfasse Mahlzeiten.</p>}
      {totalDays>0 && <input placeholder="Lebensmittel suchen…" value={q} onChange={e=>setQ(e.target.value)}/>}
      {ql && filtered.length===0 && <p className="empty">Keine Treffer für „{q}".</p>}
      {totalDays>0 && (
        <div className="arch-scroll" style={{marginTop:10}}>
          {groups.map(([month,list])=>(
            <div key={month}>
              <div className="section-label">{month}</div>
              <ul className="archive-list">{list.map(d=>(
                <li className="archive-day" key={d.date}>
                  <button className="archive-open" onClick={()=>goDay(d.date)}>
                    <div className="archive-date"><span className="archive-wd">{weekdayShort(d.date)}</span><span className="archive-label">{dateLabel(d.date)}</span></div>
                    <div className="archive-meta"><span className="muted small">E {d.totals.protein} · KH {d.totals.carbs} · F {d.totals.fat} g · {d.foods.length} Einträge</span></div>
                    <div className={'archive-kcal'+(d.over?' over':'')}>{d.totals.calories}<span className="muted small"> / {d.budget}</span></div>
                  </button>
                  <button className="del" onClick={()=>del(d.date)}><Icon name="close"/></button>
                </li>))}</ul>
            </div>
          ))}
        </div>
      )}
      {showExport && <ExportOverlay days={days} onClose={()=>setShowExport(false)}/>}
    </section>
  );
}
function ExportOverlay({days,onClose}){
  const [copied,setCopied]=useState(false);
  const tsv=useMemo(()=>{
    const entries=[];
    Object.values(days).forEach(day=>day.foods.forEach(f=>entries.push({date:day.date,entry:f})));
    entries.sort((a,b)=>a.date.localeCompare(b.date)||a.entry.time.localeCompare(b.entry.time));
    return serializeEntries(entries);
  },[days]);
  async function copy(){try{await navigator.clipboard.writeText(tsv);setCopied(true);setTimeout(()=>setCopied(false),1500);}catch(e){}}
  function download(){const blob=new Blob([tsv],{type:'text/tab-separated-values'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='essen-export-'+todayKey()+'.tsv';a.click();URL.revokeObjectURL(url);}
  return (
    <Overlay title="Export (Tab-Format)" onClose={onClose}>
      <div className="card">
        <p className="muted small" style={{marginTop:0}}>Alle Einträge im selben Format wie der Import – kann gesichert oder wieder eingespielt werden.</p>
        <div className="import-actions">
          <button className="chip" onClick={copy}>{copied?<><Icon name="check"/> Kopiert</>:<><Icon name="content_copy"/> Kopieren</>}</button>
          <button className="chip" onClick={download}><Icon name="download"/> Als Datei</button>
        </div>
        <textarea className="import-text" value={tsv} readOnly rows={12} spellCheck={false}/>
      </div>
    </Overlay>
  );
}

/* ---------- Profil ---------- */
const PRESETS=[{mode:'lose',label:'Abnehmen (−500)',adj:-500},{mode:'lose',label:'Leicht abnehmen (−300)',adj:-300},{mode:'maintain',label:'Halten (±0)',adj:0},{mode:'gain',label:'Aufbauen (+300)',adj:300},{mode:'gain',label:'Aufbauen (+500)',adj:500}];
function Profile({state,setState,notify,setDate,goToDash}){
  const {profile,goal}=state;
  const fileRef=useRef(null);
  const setP=p=>setState(s=>({...s,profile:{...s.profile,...p}}));
  const setG=g=>setState(s=>({...s,goal:{...s.goal,...g}}));
  const tgt=targetMacros(maintenance(profile)+goal.adjustment,goal);
  const macroSum=goal.proteinPct+goal.carbsPct+goal.fatPct;
  const perWeek=weeklyChange(goal.adjustment);
  const weeks=weeksToTarget(profile,goal);
  const pickDiet=style=>setG({dietStyle:style,...DIET_MACROS[style]});
  function backup(){const data=JSON.stringify({app:'essen',v:1,exportedAt:new Date().toISOString(),state},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='essen-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url);notify('Backup heruntergeladen');}
  function restoreText(text){try{const o=JSON.parse(text);const data=o&&o.state?o.state:o;if(!data||(!data.days&&!data.profile))throw 0;if(!confirm('Aktuelle Daten durch das Backup ersetzen?'))return;setState(normalizeState(data));notify('Daten wiederhergestellt');}catch(e){alert('Konnte die Datei nicht lesen (kein gültiges Essen-Backup).');}}
  function onFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.readAsText(f);e.target.value='';}
  return (
    <div className="page">
      <header className="chat-head"><h2>Profil &amp; Wünsche</h2></header>
      <div className="tiles">
        <Stat label="Grundumsatz" value={bmr(profile)} sub="kcal/Tag"/>
        <Stat label="Erhaltung" value={maintenance(profile)} sub="kcal/Tag"/>
        <Stat label="Budget-Ziel" value={maintenance(profile)+goal.adjustment} sub="kcal/Tag"/>
      </div>

      <section className="card">
        <h3 className="card-title">Über dich</h3>
        <div className="field"><label>Name (optional)</label><input placeholder="Wie sollen wir dich nennen?" value={profile.name||''} onChange={e=>setP({name:e.target.value})}/></div>
        <div className="field"><label>Geschlecht</label>
          <div className="seg full">{['male','female'].map(s=>(<button key={s} className={profile.sex===s?'on':''} onClick={()=>setP({sex:s})}>{s==='male'?'Männlich':'Weiblich'}</button>))}</div></div>
        <div className="field-grid">
          {[['age','Alter','J'],['height','Größe','cm'],['weight','Gewicht','kg']].map(([k,l,u])=>(
            <div className="field" key={k}><label>{l}</label>
              <div className="num-suffix"><input inputMode="decimal" value={profile[k]} onChange={e=>setP({[k]:numDe(e.target.value)})}/><span>{u}</span></div></div>))}
        </div>
        <div className="field"><label>Alltagsaktivität (ohne Sport)</label>
          <select value={profile.activity} onChange={e=>setP({activity:e.target.value})}>{Object.keys(ACTIVITY).map(a=>(<option key={a} value={a}>{ACTIVITY[a].label}</option>))}</select></div>
      </section>

      <section className="card">
        <h3 className="card-title">Dein Ziel</h3>
        <div className="presets">{PRESETS.map(p=>(<button key={p.label} className={'preset'+(goal.adjustment===p.adj?' on':'')} onClick={()=>setG({adjustment:p.adj})}>{p.label}</button>))}</div>
        <div className="field-grid two">
          <div className="field"><label>Wunschgewicht</label>
            <div className="num-suffix"><input inputMode="decimal" placeholder="–" value={profile.targetWeight??''} onChange={e=>{const t=e.target.value.replace(',','.').trim();setP({targetWeight:t===''?null:(+t||null)});}}/><span>kg</span></div></div>
          <div className="field"><label>Tempo (geschätzt)</label><div className="num-static">{perWeek>0?'+':''}{perWeek} kg / Woche</div></div>
        </div>
        {weeks!=null && profile.targetWeight!=null && <p className="muted small">≈ {weeks} Wochen bis {profile.targetWeight} kg (rund {Math.round(weeks/4.3)} Monate) bei diesem Tempo.</p>}
        <label className="toggle"><input type="checkbox" checked={goal.addExercise} onChange={e=>setG({addExercise:e.target.checked})}/><span>Verbrannte Sportkalorien zum Tagesbudget addieren</span></label>
      </section>

      <section className="card">
        <h3 className="card-title">Ernährungsstil</h3>
        <p className="muted small" style={{marginTop:0}}>Wählt eine passende Makro-Verteilung als Startpunkt – du kannst sie unten anpassen.</p>
        <div className="field"><select value={goal.dietStyle} onChange={e=>pickDiet(e.target.value)}>{Object.keys(DIET_LABELS).map(d=>(<option key={d} value={d}>{DIET_LABELS[d]}</option>))}</select></div>
      </section>

      <section className="card">
        <h3 className="card-title">Makro-Verteilung</h3>
        <p className={'muted small'} style={{color:macroSum!==100?'var(--protein)':'var(--muted)'}}>Summe: {macroSum}% {macroSum!==100?'(sollte 100% sein)':<Icon name="check"/>}</p>
        {[['proteinPct','Eiweiß','var(--protein)',tgt.protein],['carbsPct','Kohlenhydrate','var(--carbs)',tgt.carbs],['fatPct','Fett','var(--fat)',tgt.fat]].map(([k,l,c,g])=>(
          <div className="pct" key={k}>
            <div className="pct-head"><span style={{color:c}}>● {l}</span><span className="muted">{goal[k]}% · {g} g</span></div>
            <input type="range" min="0" max="100" step="5" value={goal[k]} onChange={e=>setG({[k]:+e.target.value})}/>
          </div>))}
      </section>

      <section className="card">
        <h3 className="card-title">Weitere Nährwert-Ziele</h3>
        <p className="muted small" style={{marginTop:0}}>Richtwerte – passe sie an deine Wünsche an. Ziel = anstreben, Limit = möglichst nicht überschreiten.</p>
        <div className="field-grid two">
          {[['fiberGoal','Ballaststoffe-Ziel'],['sugarLimit','Zucker-Limit'],['saltLimit','Salz-Limit'],['satFatLimit','ges. FS-Limit']].map(([k,l])=>(
            <div className="field" key={k}><label>{l}</label>
              <div className="num-suffix"><input inputMode="decimal" value={goal[k]} onChange={e=>setG({[k]:numDe(e.target.value)})}/><span>g</span></div></div>))}
        </div>
      </section>

      <section className="card">
        <h3 className="card-title">Vorlieben &amp; Hinweise</h3>
        <p className="muted small" style={{marginTop:0}}>Allergien, Unverträglichkeiten, Lieblings- oder No-Go-Lebensmittel – als persönliche Notiz.</p>
        <textarea className="pref-text" placeholder="z.B. vegetarisch, keine Laktose, mag kein Fisch, viel Gemüse …" value={goal.preferences} onChange={e=>setG({preferences:e.target.value})} rows={3}/>
      </section>

      <ArchiveSection state={state} setState={setState} goDay={d=>{setDate(d);goToDash();}}/>

      <section className="card">
        <h3 className="card-title"><Icon name="save"/> Daten &amp; Sicherung</h3>
        <p className="muted small" style={{marginTop:0}}>Alle Daten liegen nur in diesem Browser. Lade regelmäßig ein Backup herunter, damit nichts verloren geht.</p>
        <div className="import-actions">
          <button className="chip" onClick={backup}><Icon name="download"/> Backup (JSON)</button>
          <button className="chip" onClick={()=>fileRef.current&&fileRef.current.click()}><Icon name="upload"/> Wiederherstellen</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={onFile}/>
        </div>
      </section>

      <p className="footer-note">Daten bleiben lokal in diesem Browser (offline-fähig). Erfassung per „Import“ (Copy &amp; Paste) oder „+ manuell“.</p>
    </div>
  );
}

/* ---------- App ---------- */
const TABS=[{id:'dashboard',label:'Dashboard',icon:'space_dashboard'},{id:'today',label:'Heute',icon:'restaurant'},{id:'stats',label:'Analyse',icon:'insights'},{id:'profile',label:'Profil',icon:'settings'}];
function App(){
  const [state,setState]=useState(load);
  const [tab,setTab]=useState('dashboard');
  const [date,setDate]=useState(todayKey());
  const [importOpen,setImportOpen]=useState(false);
  const [toast,setToast]=useState(null);
  useEffect(()=>{save(state);},[state]);
  const notify=msg=>{setToast(msg);clearTimeout(notify._t);notify._t=setTimeout(()=>setToast(null),1900);};

  const theme=(state.ui&&state.ui.theme==='dark')?'dark':'light';
  useEffect(()=>{
    const el=document.documentElement;
    if(theme==='dark')el.setAttribute('data-theme','dark');else el.removeAttribute('data-theme');
    const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',theme==='dark'?'#131316':'#f6f3ef');
  },[theme]);
  const toggleTheme=()=>setState(s=>({...s,ui:{...s.ui,theme:(s.ui&&s.ui.theme==='dark')?'light':'dark'}}));

  const dateRef=useRef(date); dateRef.current=date;
  const tabRef=useRef(tab); tabRef.current=tab;
  const impRef=useRef(importOpen); impRef.current=importOpen;
  useEffect(()=>{
    const onKey=e=>{
      const t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
      if(impRef.current){ if(e.key==='Escape')setImportOpen(false); return; }
      const onDay=tabRef.current==='today'||tabRef.current==='dashboard';
      if(e.key==='ArrowLeft'&&onDay){setDate(addDays(dateRef.current,-1));}
      else if(e.key==='ArrowRight'&&onDay){if(dateRef.current<todayKey())setDate(addDays(dateRef.current,1));}
      else if(e.key==='t'||e.key==='T'){setDate(todayKey());setTab('today');}
      else if(e.key==='i'||e.key==='I'){setImportOpen(true);}
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);

  return (
    <div className="app">
      <main className="content">
        {tab==='dashboard' && <Dashboard state={state} setState={setState} date={date} setDate={setDate} openImport={()=>setImportOpen(true)}/>}
        {tab==='today' && <Today state={state} setState={setState} date={date} setDate={setDate} openImport={()=>setImportOpen(true)} notify={notify}/>}
        {tab==='stats' && <Stats state={state} setDate={setDate} goToToday={()=>setTab('dashboard')}/>}
        {tab==='profile' && <Profile state={state} setState={setState} notify={notify} setDate={setDate} goToDash={()=>setTab('dashboard')}/>}
      </main>
      <nav className="tabbar">
        <div className="brand"><span className="brand-icon"><Icon name="nutrition"/></span><span className="brand-name">Essen</span></div>
        {TABS.map(t=>(
        <button key={t.id} className={'tab'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
          <span className="tab-icon"><Icon name={t.icon}/></span><span className="tab-label">{t.label}</span></button>))}
        <button className="tab theme-toggle" onClick={toggleTheme} title="Hell/Dunkel umschalten" aria-label="Design umschalten">
          <span className="tab-icon"><Icon name={theme==='dark'?'light_mode':'dark_mode'}/></span>
          <span className="tab-label">{theme==='dark'?'Hell':'Dunkel'}</span></button>
      </nav>
      {importOpen && <ImportPanel state={state} setState={setState} setDate={setDate} onClose={()=>setImportOpen(false)}/>}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
