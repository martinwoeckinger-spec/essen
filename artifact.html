<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Essen – Kalorientracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.0/babel.min.js"></script>
<style>
  :root{
    --bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--card2:#273449;--text:#f1f5f9;--muted:#94a3b8;
    --accent:#16a34a;--accent2:#22c55e;--danger:#ef4444;--track:#334155;
    --protein:#f59e0b;--carbs:#38bdf8;--fat:#f472b6;--radius:16px;
    --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px}
  input,select,button{font-family:inherit;font-size:16px}
  .app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .page{padding:calc(var(--safe-top) + 12px) 14px 24px;display:flex;flex-direction:column;gap:14px}
  .tabbar{display:flex;background:var(--bg2);border-top:1px solid #0b1220;padding-bottom:var(--safe-bottom)}
  .tab{flex:1;background:none;border:none;color:var(--muted);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .tab.active{color:var(--accent2)}
  .tab-icon{font-size:22px;line-height:1}.tab-label{font-size:11px;font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);padding:16px}
  .card-title{margin:0 0 12px;font-size:15px;font-weight:700}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .datebar-label{font-size:20px;font-weight:800}
  .nav-btn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card2);color:var(--text);font-size:22px;cursor:pointer}
  .nav-btn:disabled{opacity:.3}
  .hero{display:flex;flex-direction:column;align-items:center;gap:16px}
  .ring-wrap{position:relative;width:200px;height:200px}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-value{font-size:44px;font-weight:800;line-height:1}.ring-value.over{color:var(--danger)}
  .ring-label{color:var(--muted);font-size:13px;margin-top:4px}
  .hero-stats{display:flex;width:100%;justify-content:space-around}
  .stat{text-align:center;flex:1}.stat-value{font-size:20px;font-weight:800}
  .stat-label{font-size:12px;color:var(--muted)}.stat-sub{font-size:11px;color:var(--muted)}
  .macro{margin-bottom:12px}.macro:last-child{margin-bottom:0}
  .macro-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
  .macro-label{font-weight:600}.macro-num{font-weight:700}
  .bar{height:9px;background:var(--track);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .3s}
  .energy-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:var(--muted);border-bottom:1px solid #0b122033}
  .energy-row strong{color:var(--text)}
  .energy-row.total{border-bottom:none;font-size:16px;color:var(--text);padding-top:12px}
  .energy-row.total strong{color:var(--accent2)}
  .suggest-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .suggest-btn:disabled{background:var(--card2);color:var(--muted)}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .section-head .card-title{margin:0}.section-actions{display:flex;gap:6px}
  .chip{background:var(--card2);border:none;color:var(--text);padding:6px 10px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
  .empty{color:var(--muted);font-size:14px;margin:6px 0 0}
  .entries{list-style:none;margin:8px 0 0;padding:0}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #0b122044}
  .entry-main{flex:1;min-width:0}.entry-name{font-weight:600;display:block}
  .entry-qty{font-size:12px;color:var(--accent2)}.entry-macros{display:block;font-size:12px;color:var(--muted)}
  .entry-kcal{font-weight:800;font-variant-numeric:tabular-nums}.entry-kcal.burn{color:var(--accent2)}
  .del{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
  .form{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .form-grid.two{grid-template-columns:repeat(2,1fr)}
  input,select{background:var(--bg);border:1px solid var(--track);color:var(--text);border-radius:10px;padding:11px 12px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--accent2)}
  .primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
  .chat-page{height:100%;padding-bottom:0}
  .chat-head{display:flex;justify-content:space-between;align-items:center}.chat-head h2{margin:0;font-size:22px}
  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
  .msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
  .msg.typing{display:flex;gap:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .chat-intro{color:var(--muted);font-size:14px}
  .examples{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .example{text-align:left;background:var(--card);border:1px solid var(--track);color:var(--text);padding:11px 13px;border-radius:12px;cursor:pointer;font-size:14px}
  .composer{display:flex;gap:8px;padding:10px 2px calc(var(--safe-bottom) + 10px)}
  .composer input{flex:1}
  .send{width:48px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  .send:disabled{opacity:.4}
  .banner{padding:12px;border-radius:12px;font-size:14px}
  .banner.ok{background:#052e16;color:#86efac}.banner.warn{background:#422006;color:#fde68a}
  .error{background:#450a0a;color:#fecaca;padding:10px 12px;border-radius:12px;font-size:13px}
  .seg{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:10px}
  .seg button{background:none;border:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}.seg.full{width:100%}.seg.full button{flex:1}
  .chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
  .chart-bar-wrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .chart-bar{width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .chart-bar.over{background:var(--danger)}
  .budget-line{position:absolute;left:0;right:0;height:2px;background:var(--muted);opacity:.6}
  .chart-label{font-size:10px;color:var(--muted);margin-top:4px}
  .field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num-suffix{position:relative;display:flex;align-items:center}
  .num-suffix span{position:absolute;right:12px;color:var(--muted);font-size:13px;pointer-events:none}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .preset{background:var(--card2);border:1px solid transparent;color:var(--text);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .preset.on{border-color:var(--accent2);background:#14321f}
  .toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .pct{margin-bottom:14px}.pct-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;font-weight:600}
  .pct input[type=range]{width:100%;accent-color:var(--accent)}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:0 12px}
  .muted{color:var(--muted)}.small{font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- Berechnung ---------- */
const ACTIVITY = {
  sedentary:{f:1.2,label:'Sitzend – kaum Bewegung'},
  light:{f:1.375,label:'Leicht aktiv – Bürojob'},
  moderate:{f:1.55,label:'Mäßig aktiv – viel unterwegs'},
  active:{f:1.725,label:'Sehr aktiv – körperliche Arbeit'},
  very_active:{f:1.9,label:'Extrem aktiv'},
};
const bmr = p => Math.round(10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='male'?5:-161));
const maintenance = p => Math.round(bmr(p)*ACTIVITY[p.activity].f);
const dailyBudget = (p,g,ex) => Math.round(maintenance(p)+g.adjustment+(g.addExercise?ex:0));
const targetMacros = (cal,g) => ({
  protein:Math.round(cal*g.proteinPct/100/4),
  carbs:Math.round(cal*g.carbsPct/100/4),
  fat:Math.round(cal*g.fatPct/100/9),
});
const sumCal = fs => Math.round(fs.reduce((a,f)=>a+(+f.calories||0),0));
const sumMac = fs => ({
  protein:Math.round(fs.reduce((a,f)=>a+(+f.protein||0),0)),
  carbs:Math.round(fs.reduce((a,f)=>a+(+f.carbs||0),0)),
  fat:Math.round(fs.reduce((a,f)=>a+(+f.fat||0),0)),
});

/* ---------- Datum ---------- */
const todayKey = (d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (k,n)=>{const[y,m,d]=k.split('-').map(Number);return todayKey(new Date(y,m-1,d+n));};
const dateLabel = k=>{const t=todayKey();if(k===t)return'Heute';if(k===addDays(t,-1))return'Gestern';const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});};
const timeLabel = iso=>{try{return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
const uid = ()=> (crypto?.randomUUID?.() || Math.random().toString(36).slice(2));

/* ---------- Persistenz (mit Fallback für Artefakt-Sandbox) ---------- */
const DEFAULTS = {
  profile:{sex:'male',age:30,height:180,weight:80,activity:'light'},
  goal:{adjustment:0,proteinPct:30,carbsPct:40,fatPct:30,addExercise:true},
  settings:{apiKey:'',model:'claude-sonnet-4-6'},
  days:{},
  chat:[],
};
function load(){ try{const s=localStorage.getItem('essen-artifact');if(s)return{...DEFAULTS,...JSON.parse(s)};}catch(e){} return DEFAULTS; }
function save(s){ try{localStorage.setItem('essen-artifact',JSON.stringify(s));}catch(e){} }

const HAS_AI = typeof window!=='undefined' && window.claude && typeof window.claude.complete==='function';

/* ---------- KI-Abruf ---------- */
async function getCompletion(prompt, settings){
  if(HAS_AI) return await window.claude.complete(prompt);
  if(settings.apiKey){
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:settings.model,max_tokens:1024,messages:[{role:'user',content:prompt}]}),
    });
    if(!res.ok) throw new Error('API '+res.status+': '+(await res.text()).slice(0,160));
    const data = await res.json();
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
  throw new Error('Keine KI verfügbar. Öffne die App als Claude-Artefakt (kein Key nötig) oder trage im Profil einen API-Key ein.');
}
function extractJSON(text){
  let t=(text||'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence)t=fence[1].trim();
  const s=t.indexOf('{'),e=t.lastIndexOf('}');
  if(s>=0&&e>s)t=t.slice(s,e+1);
  return JSON.parse(t);
}

/* ---------- UI-Bausteine ---------- */
function Ring({consumed,budget}){
  const size=200,stroke=18,r=(size-stroke)/2,c=2*Math.PI*r;
  const frac=budget>0?Math.min(consumed/budget,1):0, over=consumed>budget, rem=budget-consumed;
  return (
    <div className="ring-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={over?'var(--danger)':'var(--accent)'} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-frac)} transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <div className="ring-center">
        <div className={'ring-value'+(over?' over':'')}>{Math.abs(rem)}</div>
        <div className="ring-label">{over?'kcal drüber':'kcal übrig'}</div>
      </div>
    </div>
  );
}
const MacroBar=({label,value,target,color,unit='g'})=>(
  <div className="macro">
    <div className="macro-head"><span className="macro-label">{label}</span>
      <span className="macro-num">{value}<span className="muted"> / {target} {unit}</span></span></div>
    <div className="bar"><div className="bar-fill" style={{width:(target>0?Math.min(value/target,1):0)*100+'%',background:color}}/></div>
  </div>
);
const Stat=({label,value,sub})=>(<div className="stat"><div className="stat-value">{value}</div><div className="stat-label">{label}</div>{sub&&<div className="stat-sub">{sub}</div>}</div>);

/* ---------- Heute ---------- */
function Today({state,setState,date,setDate,goToChat,suggest}){
  const {profile,goal}=state;
  const day=state.days[date]||{date,foods:[],exercises:[]};
  const consumed=sumCal(day.foods), eaten=sumMac(day.foods);
  const burned=Math.round(day.exercises.reduce((a,e)=>a+(+e.calories||0),0));
  const budget=dailyBudget(profile,goal,burned), target=targetMacros(budget,goal);
  const remaining=budget-consumed;
  const [openF,setOpenF]=useState(false),[openE,setOpenE]=useState(false);

  const addFood=f=>setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,foods:[...d.foods,{...f,id:uid(),time:new Date().toISOString()}]}}};});
  const addEx=e=>setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,exercises:[...d.exercises,{...e,id:uid(),time:new Date().toISOString()}]}}};});
  const rmFood=id=>setState(s=>{const d=s.days[date];if(!d)return s;return{...s,days:{...s.days,[date]:{...d,foods:d.foods.filter(x=>x.id!==id)}}};});
  const rmEx=id=>setState(s=>{const d=s.days[date];if(!d)return s;return{...s,days:{...s.days,[date]:{...d,exercises:d.exercises.filter(x=>x.id!==id)}}};});

  return (
    <div className="page">
      <header className="datebar">
        <button className="nav-btn" onClick={()=>setDate(addDays(date,-1))}>‹</button>
        <div className="datebar-label">{dateLabel(date)}</div>
        <button className="nav-btn" onClick={()=>setDate(addDays(date,1))} disabled={date>=todayKey()}>›</button>
      </header>
      <section className="card hero">
        <Ring consumed={consumed} budget={budget}/>
        <div className="hero-stats">
          <Stat label="Budget" value={budget} sub="kcal"/>
          <Stat label="Gegessen" value={consumed} sub="kcal"/>
          <Stat label="Sport" value={'+'+burned} sub="kcal"/>
        </div>
      </section>
      <section className="card">
        <h3 className="card-title">Makronährstoffe</h3>
        <MacroBar label="Eiweiß" value={eaten.protein} target={target.protein} color="var(--protein)"/>
        <MacroBar label="Kohlenhydrate" value={eaten.carbs} target={target.carbs} color="var(--carbs)"/>
        <MacroBar label="Fett" value={eaten.fat} target={target.fat} color="var(--fat)"/>
      </section>
      <section className="card">
        <div className="energy-row"><span>Grundumsatz</span><strong>{bmr(profile)} kcal</strong></div>
        <div className="energy-row"><span>+ Alltag (Erhaltung)</span><strong>{maintenance(profile)} kcal</strong></div>
        <div className="energy-row"><span>+ Sportumsatz heute</span><strong>{burned} kcal</strong></div>
        <div className="energy-row"><span>± Ziel-Anpassung</span><strong>{goal.adjustment>0?'+':''}{goal.adjustment} kcal</strong></div>
        <div className="energy-row total"><span>= Tagesbudget</span><strong>{budget} kcal</strong></div>
      </section>
      <button className="suggest-btn" disabled={remaining<=0} onClick={()=>suggest(remaining,target,eaten)}>
        💡 {remaining>0?`Vorschläge für ${remaining} fehlende kcal`:'Budget erreicht'}
      </button>

      <section className="card">
        <div className="section-head"><h3 className="card-title">Mahlzeiten</h3>
          <div className="section-actions">
            <button className="chip" onClick={goToChat}>💬 per Chat</button>
            <button className="chip" onClick={()=>setOpenF(o=>!o)}>{openF?'✕':'+ manuell'}</button>
          </div></div>
        {openF && <EntryForm food onSubmit={f=>{addFood(f);setOpenF(false);}}/>}
        {day.foods.length===0 && !openF && <p className="empty">Noch nichts erfasst.</p>}
        <ul className="entries">{day.foods.map(f=>(
          <li className="entry" key={f.id}>
            <div className="entry-main"><span className="entry-name">{f.name}</span>
              {f.quantity&&<span className="entry-qty">{f.quantity}</span>}
              <span className="entry-macros">E {f.protein} · KH {f.carbs} · F {f.fat} g · {timeLabel(f.time)}</span></div>
            <div className="entry-kcal">{Math.round(f.calories)}</div>
            <button className="del" onClick={()=>rmFood(f.id)}>×</button>
          </li>))}</ul>
      </section>

      <section className="card">
        <div className="section-head"><h3 className="card-title">Sport</h3>
          <div className="section-actions">
            <button className="chip" onClick={goToChat}>💬 per Chat</button>
            <button className="chip" onClick={()=>setOpenE(o=>!o)}>{openE?'✕':'+ manuell'}</button>
          </div></div>
        {openE && <EntryForm onSubmit={e=>{addEx(e);setOpenE(false);}}/>}
        {day.exercises.length===0 && !openE && <p className="empty">Noch kein Sport erfasst.</p>}
        <ul className="entries">{day.exercises.map(e=>(
          <li className="entry" key={e.id}>
            <div className="entry-main"><span className="entry-name">{e.name}</span>
              <span className="entry-macros">{e.durationMin?e.durationMin+' min · ':''}{timeLabel(e.time)}</span></div>
            <div className="entry-kcal burn">−{Math.round(e.calories)}</div>
            <button className="del" onClick={()=>rmEx(e.id)}>×</button>
          </li>))}</ul>
      </section>
    </div>
  );
}

function EntryForm({food,onSubmit}){
  const [v,setV]=useState({name:'',quantity:'',calories:'',protein:'',carbs:'',fat:'',durationMin:''});
  const ch=k=>e=>setV({...v,[k]:e.target.value});
  return (
    <form className="form" onSubmit={e=>{e.preventDefault();if(!v.name.trim())return;
      onSubmit(food
        ?{name:v.name.trim(),quantity:v.quantity.trim()||undefined,calories:+v.calories||0,protein:+v.protein||0,carbs:+v.carbs||0,fat:+v.fat||0}
        :{name:v.name.trim(),durationMin:v.durationMin?+v.durationMin:undefined,calories:+v.calories||0});}}>
      <input placeholder={food?'Was hast du gegessen?':'Aktivität (z.B. Joggen)'} value={v.name} onChange={ch('name')}/>
      {food
        ?(<>
            <input placeholder="Menge (z.B. 200 g)" value={v.quantity} onChange={ch('quantity')}/>
            <div className="form-grid">
              <input inputMode="numeric" placeholder="kcal" value={v.calories} onChange={ch('calories')}/>
              <input inputMode="numeric" placeholder="Eiweiß g" value={v.protein} onChange={ch('protein')}/>
              <input inputMode="numeric" placeholder="KH g" value={v.carbs} onChange={ch('carbs')}/>
              <input inputMode="numeric" placeholder="Fett g" value={v.fat} onChange={ch('fat')}/>
            </div>
          </>)
        :(<div className="form-grid two">
            <input inputMode="numeric" placeholder="Minuten" value={v.durationMin} onChange={ch('durationMin')}/>
            <input inputMode="numeric" placeholder="kcal verbrannt" value={v.calories} onChange={ch('calories')}/>
          </div>)}
      <button type="submit" className="primary">Hinzufügen</button>
    </form>
  );
}

/* ---------- Chat ---------- */
function Chat({state,setState,date,goToProfile,pending,clearPending}){
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const scroll=useRef(null);
  useEffect(()=>{scroll.current&&scroll.current.scrollTo({top:scroll.current.scrollHeight,behavior:'smooth'});},[state.chat,busy]);

  const addFood=f=>setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,foods:[...d.foods,{...f,id:uid(),time:new Date().toISOString()}]}}};});
  const addEx=e=>setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,exercises:[...d.exercises,{...e,id:uid(),time:new Date().toISOString()}]}}};});
  const push=m=>setState(s=>({...s,chat:[...s.chat,m]}));

  async function send(text){
    text=(text||'').trim(); if(!text||busy)return; setErr(null);
    const cur=useStateSnapshot();
    const day=cur.days[date]||{foods:[],exercises:[]};
    const burned=Math.round(day.exercises.reduce((a,e)=>a+(+e.calories||0),0));
    const budget=dailyBudget(cur.profile,cur.goal,burned), eaten=sumMac(day.foods), consumed=sumCal(day.foods), tgt=targetMacros(budget,cur.goal);
    const history=cur.chat.slice(-6).map(m=>`${m.role==='user'?'Nutzer':'Assistent'}: ${m.content}`).join('\n');
    push({role:'user',content:text}); setInput(''); setBusy(true);
    const prompt=
`Du bist der Ernährungs-Assistent der App "Essen" (Kalorien- und Makrotracker). Antworte freundlich und kurz auf Deutsch.
Aktueller Tag: ${dateLabel(date)}. Profil: ${cur.profile.sex==='male'?'männlich':'weiblich'}, ${cur.profile.age} J, ${cur.profile.height} cm, ${cur.profile.weight} kg.
Grundumsatz ${bmr(cur.profile)} kcal, Erhaltung ${maintenance(cur.profile)} kcal.
Tagesbudget ${budget} kcal. Bereits gegessen ${consumed} kcal (E ${eaten.protein}/KH ${eaten.carbs}/F ${eaten.fat} g). Restbudget ${budget-consumed} kcal.
Ziel-Makros: E ${tgt.protein}/KH ${tgt.carbs}/F ${tgt.fat} g.
${history?('Bisheriger Verlauf:\n'+history+'\n'):''}
Neue Nutzernachricht: "${text}"

Wenn der Nutzer beschreibt, was er gegessen oder an Sport gemacht hat, erfasse jedes Lebensmittel/jede Aktivität einzeln und schätze fehlende Nährwerte realistisch.
Antworte AUSSCHLIESSLICH mit reinem JSON (keine weiteren Worte, kein Markdown), exakt in diesem Format:
{"reply":"kurze Antwort an den Nutzer","foods":[{"name":"","quantity":"","calories":0,"protein":0,"carbs":0,"fat":0}],"exercises":[{"name":"","durationMin":0,"calories":0}]}
Leere Arrays, wenn nichts einzutragen ist (z.B. bei Fragen oder Vorschlägen).`;
    try{
      const raw=await getCompletion(prompt,cur.settings);
      let data; try{data=extractJSON(raw);}catch(e){data={reply:raw,foods:[],exercises:[]};}
      (data.foods||[]).forEach(f=>{if(f&&f.name)addFood({name:f.name,quantity:f.quantity||undefined,calories:Math.round(+f.calories||0),protein:Math.round(+f.protein||0),carbs:Math.round(+f.carbs||0),fat:Math.round(+f.fat||0)});});
      (data.exercises||[]).forEach(e=>{if(e&&e.name)addEx({name:e.name,durationMin:e.durationMin?+e.durationMin:undefined,calories:Math.round(+e.calories||0)});});
      push({role:'assistant',content:data.reply||'Erledigt.'});
    }catch(e){ setErr(e.message||String(e)); }
    finally{ setBusy(false); }
  }
  // Snapshot-Helfer, um im async-Callback den aktuellen State zu lesen
  const snapRef=useRef(state); snapRef.current=state;
  function useStateSnapshot(){ return snapRef.current; }

  useEffect(()=>{ if(pending){ const p=pending; clearPending(); send(p); } /* eslint-disable-next-line */ },[pending]);

  return (
    <div className="page chat-page">
      <header className="chat-head">
        <div><h2>KI-Chat</h2><span className="muted small">Tag: {dateLabel(date)}</span></div>
        {state.chat.length>0 && <button className="chip" onClick={()=>setState(s=>({...s,chat:[]}))}>Verlauf leeren</button>}
      </header>
      {HAS_AI
        ? <div className="banner ok">✨ KI aktiv – kein API-Key nötig (läuft über Claude).</div>
        : !state.settings.apiKey && <div className="banner warn" style={{cursor:'pointer'}} onClick={goToProfile}>🔑 Kein API-Key. Als Claude-Artefakt öffnen (kein Key nötig) oder hier tippen, um einen Key im Profil einzutragen.</div>}
      <div className="messages" ref={scroll}>
        {state.chat.length===0 && (
          <div className="chat-intro">
            <p>Erzähl mir, was du gegessen hast – ich trage es ein. Zum Beispiel:</p>
            <div className="examples">
              {['2 Scheiben Vollkornbrot mit Käse und Butter','Eine Banane und ein Kaffee mit Milch','30 Minuten joggen','Was kann ich noch essen, um auf mein Eiweißziel zu kommen?'].map(ex=>(
                <button key={ex} className="example" onClick={()=>send(ex)}>{ex}</button>))}
            </div>
          </div>)}
        {state.chat.map((m,i)=>(<div key={i} className={'msg '+m.role}>{m.content}</div>))}
        {busy && <div className="msg assistant typing"><span className="dot"/><span className="dot"/><span className="dot"/></div>}
      </div>
      {err && <div className="error">{err}</div>}
      <form className="composer" onSubmit={e=>{e.preventDefault();send(input);}}>
        <input placeholder="Nachricht schreiben…" value={input} onChange={e=>setInput(e.target.value)} disabled={busy}/>
        <button type="submit" className="send" disabled={busy||!input.trim()}>➤</button>
      </form>
    </div>
  );
}

/* ---------- Auswertung ---------- */
function Stats({state}){
  const {profile,goal,days}=state;
  const [range,setRange]=useState(7);
  const keys=[]; for(let i=range-1;i>=0;i--)keys.push(addDays(todayKey(),-i));
  const rows=keys.map(k=>{const d=days[k]||{foods:[],exercises:[]};const burned=Math.round(d.exercises.reduce((a,e)=>a+(+e.calories||0),0));return{key:k,budget:dailyBudget(profile,goal,burned),consumed:sumCal(d.foods),macros:sumMac(d.foods),has:d.foods.length>0};});
  const tracked=rows.filter(r=>r.has);
  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const avgCons=avg(tracked.map(r=>r.consumed));
  const avgBudget=avg(rows.map(r=>r.budget));
  const tgt=targetMacros(avgBudget,goal);
  const maxV=Math.max(...rows.map(r=>Math.max(r.budget,r.consumed)),1);
  return (
    <div className="page">
      <header className="chat-head"><h2>Auswertung</h2>
        <div className="seg">{[7,14,30].map(r=>(<button key={r} className={range===r?'on':''} onClick={()=>setRange(r)}>{r} T</button>))}</div></header>
      <section className="card">
        <h3 className="card-title">Kalorien pro Tag</h3>
        <div className="chart">{rows.map(r=>(
          <div className="chart-col" key={r.key} title={`${r.consumed} / ${r.budget} kcal`}>
            <div className="chart-bar-wrap">
              <div className="budget-line" style={{bottom:(r.budget/maxV)*100+'%'}}/>
              <div className={'chart-bar'+(r.consumed>r.budget?' over':'')} style={{height:Math.min((r.consumed/maxV)*100,100)+'%'}}/>
            </div>
            <div className="chart-label">{r.key.slice(8)}</div>
          </div>))}</div>
      </section>
      <section className="card">
        <h3 className="card-title">Durchschnitt {tracked.length>0?`(${tracked.length} erfasste Tage)`:''}</h3>
        <div className="energy-row total"><span>Ø Kalorien</span><strong>{avgCons} kcal</strong></div>
        <div style={{height:12}}/>
        <MacroBar label="Ø Eiweiß" value={avg(tracked.map(r=>r.macros.protein))} target={tgt.protein} color="var(--protein)"/>
        <MacroBar label="Ø Kohlenhydrate" value={avg(tracked.map(r=>r.macros.carbs))} target={tgt.carbs} color="var(--carbs)"/>
        <MacroBar label="Ø Fett" value={avg(tracked.map(r=>r.macros.fat))} target={tgt.fat} color="var(--fat)"/>
      </section>
      {tracked.length===0 && <p className="empty">Noch keine Daten im Zeitraum. Erfasse Mahlzeiten unter „Heute".</p>}
    </div>
  );
}

/* ---------- Profil ---------- */
const PRESETS=[{label:'Abnehmen (−500)',adj:-500},{label:'Leicht abnehmen (−300)',adj:-300},{label:'Halten (±0)',adj:0},{label:'Aufbauen (+300)',adj:300},{label:'Aufbauen (+500)',adj:500}];
const MODELS=[{id:'claude-haiku-4-5-20251001',label:'Haiku 4.5 – schnell & günstig'},{id:'claude-sonnet-4-6',label:'Sonnet 4.6 – ausgewogen'},{id:'claude-opus-4-8',label:'Opus 4.8 – höchste Qualität'}];
function Profile({state,setState}){
  const {profile,goal,settings}=state;
  const [showKey,setShowKey]=useState(false);
  const setP=p=>setState(s=>({...s,profile:{...s.profile,...p}}));
  const setG=g=>setState(s=>({...s,goal:{...s.goal,...g}}));
  const setS=st=>setState(s=>({...s,settings:{...s.settings,...st}}));
  const tgt=targetMacros(maintenance(profile)+goal.adjustment,goal);
  const macroSum=goal.proteinPct+goal.carbsPct+goal.fatPct;
  return (
    <div className="page">
      <header className="chat-head"><h2>Profil &amp; Ziele</h2></header>
      <section className="card"><div className="hero-stats">
        <Stat label="Grundumsatz" value={bmr(profile)} sub="kcal/Tag"/>
        <Stat label="Erhaltung" value={maintenance(profile)} sub="kcal/Tag"/>
        <Stat label="Budget-Ziel" value={maintenance(profile)+goal.adjustment} sub="kcal/Tag"/>
      </div></section>
      <section className="card">
        <h3 className="card-title">Körperdaten</h3>
        <div className="field"><label>Geschlecht</label>
          <div className="seg full">{['male','female'].map(s=>(<button key={s} className={profile.sex===s?'on':''} onClick={()=>setP({sex:s})}>{s==='male'?'Männlich':'Weiblich'}</button>))}</div></div>
        <div className="field-grid">
          {[['age','Alter','J'],['height','Größe','cm'],['weight','Gewicht','kg']].map(([k,l,u])=>(
            <div className="field" key={k}><label>{l}</label>
              <div className="num-suffix"><input inputMode="numeric" value={profile[k]} onChange={e=>setP({[k]:+e.target.value||0})}/><span>{u}</span></div></div>))}
        </div>
        <div className="field"><label>Alltagsaktivität (ohne Sport)</label>
          <select value={profile.activity} onChange={e=>setP({activity:e.target.value})}>
            {Object.keys(ACTIVITY).map(a=>(<option key={a} value={a}>{ACTIVITY[a].label}</option>))}</select></div>
      </section>
      <section className="card">
        <h3 className="card-title">Ziel</h3>
        <div className="presets">{PRESETS.map(p=>(<button key={p.label} className={'preset'+(goal.adjustment===p.adj?' on':'')} onClick={()=>setG({adjustment:p.adj})}>{p.label}</button>))}</div>
        <label className="toggle"><input type="checkbox" checked={goal.addExercise} onChange={e=>setG({addExercise:e.target.checked})}/><span>Verbrannte Sportkalorien zum Budget addieren</span></label>
      </section>
      <section className="card">
        <h3 className="card-title">Makro-Verteilung</h3>
        <p className={'muted small'+(macroSum!==100?' ':'')} style={{color:macroSum!==100?'var(--protein)':'var(--muted)'}}>Summe: {macroSum}% {macroSum!==100?'(sollte 100% sein)':'✓'}</p>
        {[['proteinPct','Eiweiß','var(--protein)',tgt.protein],['carbsPct','Kohlenhydrate','var(--carbs)',tgt.carbs],['fatPct','Fett','var(--fat)',tgt.fat]].map(([k,l,c,g])=>(
          <div className="pct" key={k}>
            <div className="pct-head"><span style={{color:c}}>● {l}</span><span className="muted">{goal[k]}% · {g} g</span></div>
            <input type="range" min="0" max="100" step="5" value={goal[k]} onChange={e=>setG({[k]:+e.target.value})}/>
          </div>))}
      </section>
      <section className="card">
        <h3 className="card-title">KI-Chat</h3>
        {HAS_AI
          ? <p className="muted small">✨ Läuft als Claude-Artefakt – die KI ist ohne API-Key aktiv. Ein Key ist nur nötig, wenn du die Datei standalone im Browser öffnest.</p>
          : <p className="muted small">Standalone-Modus: Für den KI-Chat einen Anthropic-API-Key eintragen (nur lokal gespeichert). Oder die Datei als Claude-Artefakt öffnen – dann ohne Key.</p>}
        <div className="field"><label>API-Key (optional)</label>
          <div style={{display:'flex',gap:8}}>
            <input type={showKey?'text':'password'} placeholder="sk-ant-…" value={settings.apiKey} onChange={e=>setS({apiKey:e.target.value.trim()})} autoComplete="off"/>
            <button className="chip" onClick={()=>setShowKey(s=>!s)}>{showKey?'🙈':'👁️'}</button></div></div>
        <div className="field"><label>Modell</label>
          <select value={settings.model} onChange={e=>setS({model:e.target.value})}>{MODELS.map(m=>(<option key={m.id} value={m.id}>{m.label}</option>))}</select></div>
      </section>
      <p className="footer-note">{HAS_AI?'Hinweis: In der Artefakt-Vorschau werden Daten evtl. nicht dauerhaft gespeichert.':'Daten bleiben lokal in diesem Browser.'}</p>
    </div>
  );
}

/* ---------- App ---------- */
const TABS=[{id:'today',label:'Heute',icon:'🍽️'},{id:'chat',label:'KI-Chat',icon:'💬'},{id:'stats',label:'Auswertung',icon:'📊'},{id:'profile',label:'Profil',icon:'⚙️'}];
function App(){
  const [state,setState]=useState(load);
  const [tab,setTab]=useState('today');
  const [date,setDate]=useState(todayKey());
  const [pending,setPending]=useState(null);
  useEffect(()=>{save(state);},[state]);

  function suggest(remaining,target,eaten){
    setPending(`Mir fehlen heute noch ${Math.max(remaining,0)} kcal bis zum Tagesbudget (Eiweiß ${Math.max(target.protein-eaten.protein,0)} g, Kohlenhydrate ${Math.max(target.carbs-eaten.carbs,0)} g, Fett ${Math.max(target.fat-eaten.fat,0)} g übrig). Mach mir 3 konkrete, alltagstaugliche Vorschläge dafür. Trage noch nichts ein.`);
    setTab('chat');
  }
  return (
    <div className="app">
      <main className="content">
        {tab==='today' && <Today state={state} setState={setState} date={date} setDate={setDate} goToChat={()=>setTab('chat')} suggest={suggest}/>}
        {tab==='chat' && <Chat state={state} setState={setState} date={date} goToProfile={()=>setTab('profile')} pending={pending} clearPending={()=>setPending(null)}/>}
        {tab==='stats' && <Stats state={state}/>}
        {tab==='profile' && <Profile state={state} setState={setState}/>}
      </main>
      <nav className="tabbar">{TABS.map(t=>(
        <button key={t.id} className={'tab'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
          <span className="tab-icon">{t.icon}</span><span className="tab-label">{t.label}</span></button>))}</nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
