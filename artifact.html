<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<title>Essen – Kalorientracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.0/babel.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a;--bg2:#111111;--card:#171717;--card2:#242424;--text:#fafafa;--muted:#9ca3af;
    --accent:#f97316;--accent2:#fb923c;--danger:#ef4444;--track:#2c2c2c;
    --protein:#34d399;--carbs:#38bdf8;--fat:#c084fc;--radius:14px;
    --fiber:#a3e635;--sugar:#f472b6;--satfat:#fb7185;--salt:#94a3b8;--data:#60a5fa;
    --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px}
  input,select,button,textarea{font-family:inherit;font-size:16px}
  .app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .page{padding:calc(var(--safe-top) + 12px) 14px 24px;display:flex;flex-direction:column;gap:14px}
  .tabbar{display:flex;background:var(--bg2);border-top:1px solid #0b1220;padding-bottom:var(--safe-bottom)}
  .tab{flex:1;background:none;border:none;color:var(--muted);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .tab.active{color:var(--accent2)}
  .tab-icon{font-size:22px;line-height:1}.tab-label{font-size:11px;font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);padding:16px}
  .card-title{margin:0 0 12px;font-size:15px;font-weight:700}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .datebar-label{font-size:20px;font-weight:800}
  .nav-btn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card2);color:var(--text);font-size:22px;cursor:pointer}
  .nav-btn:disabled{opacity:.3}
  .hero{display:flex;flex-direction:column;align-items:center;gap:16px}
  .ring-wrap{position:relative;width:200px;height:200px}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-value{font-size:44px;font-weight:800;line-height:1}.ring-value.over{color:var(--danger)}
  .ring-label{color:var(--muted);font-size:13px;margin-top:4px}
  .hero-stats{display:flex;width:100%;justify-content:space-around}
  .stat{text-align:center;flex:1}.stat-value{font-size:20px;font-weight:800}
  .stat-label{font-size:12px;color:var(--muted)}.stat-sub{font-size:11px;color:var(--muted)}
  .macro{margin-bottom:12px}.macro:last-child{margin-bottom:0}
  .macro-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
  .macro-label{font-weight:600}.macro-num{font-weight:700}
  .bar{height:9px;background:var(--track);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .3s}
  .energy-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:var(--muted);border-bottom:1px solid #0b122033}
  .energy-row strong{color:var(--text)}
  .energy-row.total{border-bottom:none;font-size:16px;color:var(--text);padding-top:12px}
  .energy-row.total strong{color:var(--accent2)}
  .suggest-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .suggest-btn:disabled{background:var(--card2);color:var(--muted)}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .section-head .card-title{margin:0}.section-actions{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:none;color:var(--text);padding:6px 10px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
  .empty{color:var(--muted);font-size:14px;margin:6px 0 0}
  .entries{list-style:none;margin:8px 0 0;padding:0}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #0b122044}
  .entry-main{flex:1;min-width:0}.entry-name{font-weight:600;display:block}
  .entry-qty{font-size:12px;color:var(--accent2)}.entry-macros{display:block;font-size:12px;color:var(--muted)}
  .entry-kcal{font-weight:800;font-variant-numeric:tabular-nums}.entry-kcal.burn{color:var(--accent2)}
  .del{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
  .form{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .form-grid.two{grid-template-columns:repeat(2,1fr)}
  input,select{background:var(--bg);border:1px solid var(--track);color:var(--text);border-radius:10px;padding:11px 12px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--accent2)}
  textarea{background:var(--bg);border:1px solid var(--track);color:var(--text);border-radius:10px;padding:11px 12px;width:100%;outline:none;resize:vertical;font-size:15px}
  textarea:focus{border-color:var(--accent2)}
  .primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
  .chat-page{height:100%;padding-bottom:0}
  .chat-head{display:flex;justify-content:space-between;align-items:center}.chat-head h2{margin:0;font-size:22px}
  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
  .msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
  .msg.typing{display:flex;gap:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .chat-intro{color:var(--muted);font-size:14px}
  .examples{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .example{text-align:left;background:var(--card);border:1px solid var(--track);color:var(--text);padding:11px 13px;border-radius:12px;cursor:pointer;font-size:14px}
  .composer{display:flex;gap:8px;padding:10px 2px calc(var(--safe-bottom) + 10px)}
  .composer input{flex:1}
  .send{width:48px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  .send:disabled{opacity:.4}
  .banner{padding:12px;border-radius:12px;font-size:14px}
  .banner.ok{background:#052e16;color:#86efac}.banner.warn{background:#422006;color:#fde68a}
  .error{background:#450a0a;color:#fecaca;padding:10px 12px;border-radius:12px;font-size:13px}
  .seg{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:10px}
  .seg button{background:none;border:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}.seg.full{width:100%}.seg.full button{flex:1}
  .chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
  .chart-bar-wrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .chart-bar{width:70%;background:var(--data);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .chart-bar.over{background:var(--danger)}
  .budget-line{position:absolute;left:0;right:0;height:2px;background:var(--muted);opacity:.6}
  .chart-label{font-size:10px;color:var(--muted);margin-top:4px}
  .chart-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
  .chart-legend span{display:flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .sw.accent{background:var(--data)}.sw.danger{background:var(--danger)}.sw.line{background:var(--muted);height:3px;border-radius:2px}
  .avg-row{display:flex;justify-content:space-between;font-size:16px}.avg-row strong{color:var(--accent2)}
  .field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num-suffix{position:relative;display:flex;align-items:center}
  .num-suffix span{position:absolute;right:12px;color:var(--muted);font-size:13px;pointer-events:none}
  .num-static{background:var(--bg);border:1px solid var(--track);border-radius:10px;padding:11px 12px;color:var(--muted)}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .preset{background:var(--card2);border:1px solid transparent;color:var(--text);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .preset.on{border-color:var(--accent2);background:rgba(249,115,22,.18)}
  .toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .pct{margin-bottom:14px}.pct-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;font-weight:600}
  .pct input[type=range]{width:100%;accent-color:var(--accent)}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:0 12px}
  .muted{color:var(--muted)}.small{font-size:12px}.warn{color:var(--protein)}.over{color:var(--danger)}
  /* Mahlzeit-Gruppen */
  .meal-group{margin-top:12px}
  .meal-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #0b122044;padding-top:10px}
  .meal-title{font-size:14px;font-weight:700}
  .meal-kcal{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .entry-note{display:block;font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
  .mini-field{display:flex;flex-direction:column;gap:3px}
  .mini-field span{font-size:11px;color:var(--muted);font-weight:600}
  .mini-field input{padding:9px 8px;text-align:center}
  .warn-tag{color:var(--danger)}
  .pref-text{line-height:1.4}
  /* Overlay / Import */
  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);max-width:560px;margin:0 auto;display:flex;flex-direction:column}
  .overlay-head{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 12px) 14px 10px;border-bottom:1px solid #0b1220}
  .overlay-head h2{margin:0;font-size:18px}
  .overlay-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--safe-bottom) + 24px);display:flex;flex-direction:column;gap:14px}
  .import-cols{display:block;background:var(--bg);border:1px solid var(--track);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted);margin:8px 0;line-height:1.6}
  .import-text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .import-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .import-warn{border:1px solid #7c2d12}
  .err-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .import-success{font-size:16px;font-weight:700;margin:0 0 8px}
  .import-submit{width:100%}
  .preview-meal{margin-top:8px}
  .preview-meal-head{font-size:13px;font-weight:700;color:var(--accent2);margin:6px 0 2px}
  .preview-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
  .preview-name{min-width:0}.preview-kcal{color:var(--muted);white-space:nowrap}
  /* Metrik-Chips */
  .metric-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .metric-chip{flex:none;background:var(--card2);border:none;color:var(--muted);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .metric-chip.on{background:var(--accent);color:#fff}
  /* Archiv */
  .month-head{font-size:12px;color:var(--muted);font-weight:700;margin:6px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
  .archive-card{padding:4px 16px}
  .archive-list{list-style:none;margin:0;padding:0}
  .archive-day{display:flex;align-items:center;gap:6px;border-top:1px solid #0b122044}
  .archive-day:first-child{border-top:none}
  .archive-open{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--text);padding:12px 0;cursor:pointer;text-align:left;min-width:0}
  .archive-date{display:flex;flex-direction:column;min-width:70px}
  .archive-wd{font-size:11px;color:var(--muted)}.archive-label{font-weight:700}
  .archive-meta{flex:1;min-width:0}
  .archive-kcal{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ---------- Brand / Layout-Bausteine ---------- */
  .brand{display:none}
  .cols{display:flex;flex-direction:column;gap:14px}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .overlay-card{display:flex;flex-direction:column;flex:1;min-height:0}
  @media (hover:hover){
    .chip:hover,.preset:hover,.nav-btn:hover,.metric-chip:hover,.seg button:hover{filter:brightness(1.18)}
    .primary:hover{filter:brightness(1.08)}
    .del:hover{color:var(--danger)}
    .archive-open:hover{background:var(--card2)}
  }
  /* ---------- Desktop ---------- */
  @media (min-width:900px){
    body{font-size:15px}
    .app{flex-direction:row;max-width:1180px;height:100vh}
    .tabbar{order:-1;flex-direction:column;width:236px;flex:0 0 236px;border-top:none;border-right:1px solid var(--card2);padding:18px 14px;gap:4px;align-items:stretch}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 12px 18px;font-weight:800;font-size:20px}
    .brand-icon{font-size:24px}
    .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px}
    .tab-icon{font-size:20px}
    .tab-label{font-size:14px;font-weight:600}
    .tab.active{background:var(--card);color:var(--accent2)}
    .page{max-width:880px;margin:0 auto;padding:28px 28px 44px}
    .page-today{max-width:1060px}
    .page-today .cols{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
    .datebar-label{font-size:22px}
    .overlay{align-items:flex-start;justify-content:center;background:rgba(0,0,0,.65);max-width:none;margin:0;padding:48px 16px}
    .overlay-card{flex:none;width:100%;max-width:760px;max-height:84vh;background:var(--bg2);border:1px solid var(--card2);border-radius:16px;overflow:hidden}
    .overlay-head{padding:16px 18px}
    .overlay-body{padding:16px 18px 24px}
  }
  @media (min-width:1280px){
    .app{max-width:1320px}
    .page-today{max-width:1160px}
    .page-today .cols{grid-template-columns:360px 1fr}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Mahlzeiten ---------- */
const MEALS={
  breakfast:{label:'Frühstück',icon:'🌅',hour:8,order:0},
  lunch:{label:'Mittagessen',icon:'☀️',hour:12,order:1},
  dinner:{label:'Abendessen',icon:'🌙',hour:19,order:2},
  snack:{label:'Snack',icon:'🍎',hour:16,order:3},
};
const MEAL_ORDER=Object.keys(MEALS).sort((a,b)=>MEALS[a].order-MEALS[b].order);
const defaultMeal=()=>{const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h<18?'snack':'dinner';};

/* ---------- Berechnung ---------- */
const ACTIVITY = {
  sedentary:{f:1.2,label:'Sitzend – kaum Bewegung'},
  light:{f:1.375,label:'Leicht aktiv – Bürojob'},
  moderate:{f:1.55,label:'Mäßig aktiv – viel unterwegs'},
  active:{f:1.725,label:'Sehr aktiv – körperliche Arbeit'},
  very_active:{f:1.9,label:'Extrem aktiv'},
};
const bmr = p => Math.round(10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='male'?5:-161));
const maintenance = p => Math.round(bmr(p)*ACTIVITY[p.activity].f);
const dailyBudget = (p,g,ex) => Math.round(maintenance(p)+g.adjustment+(g.addExercise?ex:0));
const targetMacros = (cal,g) => ({
  protein:Math.round(cal*g.proteinPct/100/4),
  carbs:Math.round(cal*g.carbsPct/100/4),
  fat:Math.round(cal*g.fatPct/100/9),
});
const sumCal = fs => Math.round(fs.reduce((a,f)=>a+(+f.calories||0),0));
function sumNut(fs){
  const t={calories:0,protein:0,carbs:0,sugar:0,fat:0,saturatedFat:0,fiber:0,salt:0};
  fs.forEach(f=>{t.calories+=+f.calories||0;t.protein+=+f.protein||0;t.carbs+=+f.carbs||0;t.sugar+=+f.sugar||0;t.fat+=+f.fat||0;t.saturatedFat+=+f.saturatedFat||0;t.fiber+=+f.fiber||0;t.salt+=+f.salt||0;});
  return {calories:Math.round(t.calories),protein:Math.round(t.protein),carbs:Math.round(t.carbs),sugar:Math.round(t.sugar),fat:Math.round(t.fat),saturatedFat:Math.round(t.saturatedFat),fiber:Math.round(t.fiber),salt:Math.round(t.salt*10)/10};
}
const mealTotals = fs => { const o={}; MEAL_ORDER.forEach(m=>o[m]=sumNut(fs.filter(f=>f.meal===m))); return o; };
const DIET_MACROS={omnivore:{proteinPct:30,carbsPct:40,fatPct:30},vegetarian:{proteinPct:25,carbsPct:45,fatPct:30},vegan:{proteinPct:22,carbsPct:50,fatPct:28},pescetarian:{proteinPct:30,carbsPct:40,fatPct:30},lowcarb:{proteinPct:35,carbsPct:20,fatPct:45},highprotein:{proteinPct:40,carbsPct:35,fatPct:25},keto:{proteinPct:25,carbsPct:5,fatPct:70},mediterranean:{proteinPct:25,carbsPct:45,fatPct:30}};
const DIET_LABELS={omnivore:'Ausgewogen / Allesesser',vegetarian:'Vegetarisch',vegan:'Vegan',pescetarian:'Pescetarisch (mit Fisch)',lowcarb:'Low Carb',highprotein:'High Protein',keto:'Ketogen',mediterranean:'Mediterran'};
const KCAL_PER_KG=7700;
const weeklyChange = adj => Math.round((adj*7/KCAL_PER_KG)*10)/10;
function weeksToTarget(p,g){
  if(!p.targetWeight||+p.targetWeight===+p.weight)return null;
  const pw=weeklyChange(g.adjustment); if(pw===0)return null;
  const delta=(+p.targetWeight)-(+p.weight);
  if(Math.sign(delta)!==Math.sign(pw))return null;
  return Math.ceil(Math.abs(delta)/Math.abs(pw));
}

/* ---------- Datum ---------- */
const pad2 = s => String(s).padStart(2,'0');
const todayKey = (d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays = (k,n)=>{const[y,m,d]=k.split('-').map(Number);return todayKey(new Date(y,m-1,d+n));};
const dateLabel = k=>{const t=todayKey();if(k===t)return'Heute';if(k===addDays(t,-1))return'Gestern';const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});};
const weekdayShort = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short'});};
const monthLabel = k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});};
const fullDate = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const isoAt = (k,h,min=0)=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,h,min).toISOString();};
const timeLabel = iso=>{try{return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
const uid = ()=> (crypto?.randomUUID?.() || Math.random().toString(36).slice(2));

/* ---------- Strukturierter Import ---------- */
const MEAL_ALIASES={'frühstück':'breakfast',fruehstueck:'breakfast',fruhstuck:'breakfast',breakfast:'breakfast',morgens:'breakfast',mittagessen:'lunch',mittag:'lunch',lunch:'lunch',abendessen:'dinner',abendbrot:'dinner',abend:'dinner',dinner:'dinner',snack:'snack',snacks:'snack',zwischenmahlzeit:'snack',zwischendurch:'snack',zwischen:'snack',imbiss:'snack'};
const parseMeal = raw => MEAL_ALIASES[(raw||'').trim().toLowerCase()] || 'snack';
function parseDate(raw){
  const s=(raw||'').trim();
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m)return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  return null;
}
function parseNumber(raw){
  if(raw==null)return 0; let s=String(raw).trim();
  if(!s||s==='-'||s==='–'||/^(n\/a|k\.?\s?a\.?)$/i.test(s))return 0;
  s=s.replace(/[^0-9.,-]/g,'');
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function splitRow(line){
  if(line.includes('\t'))return line.split('\t').map(c=>c.trim());
  if(line.includes('|')){let p=line.split('|').map(c=>c.trim());if(p.length&&p[0]==='')p.shift();if(p.length&&p[p.length-1]==='')p.pop();return p;}
  return line.split(/\s{2,}/).map(c=>c.trim());
}
const isSep = cells => cells.length>0 && cells.every(c=>/^:?-{2,}:?$/.test(c)||c==='');
const isHeader = cells => parseDate(cells[0]||'')===null && /datum|mahlzeit|kalorien|kcal|eiwei|protein|nahrungs/i.test(cells.join(' '));
function parseStructured(input){
  const rows=[],errors=[];
  const lines=(input||'').replace(/\r\n?/g,'\n').split('\n');
  lines.forEach((raw,i)=>{
    const lineNo=i+1, trimmed=raw.trim(); if(!trimmed)return;
    const cells=splitRow(raw);
    if(isSep(cells)||isHeader(cells))return;
    if(cells.length<5){errors.push({line:lineNo,text:trimmed,reason:'Zu wenige Spalten (mind. Datum, Mahlzeit, Name, Menge, kcal – Tab-getrennt).'});return;}
    const date=parseDate(cells[0]); if(!date){errors.push({line:lineNo,text:trimmed,reason:'Datum "'+cells[0]+'" nicht erkannt.'});return;}
    const name=(cells[2]||'').trim(); if(!name){errors.push({line:lineNo,text:trimmed,reason:'Kein Nahrungsmittel-Name.'});return;}
    const note=(cells[12]||'').trim();
    rows.push({date,meal:parseMeal(cells[1]),mealLabel:(cells[1]||'').trim()||MEALS[parseMeal(cells[1])].label,name,quantity:(cells[3]||'').trim()||undefined,calories:parseNumber(cells[4]),protein:parseNumber(cells[5]),carbs:parseNumber(cells[6]),sugar:parseNumber(cells[7]),fat:parseNumber(cells[8]),saturatedFat:parseNumber(cells[9]),fiber:parseNumber(cells[10]),salt:parseNumber(cells[11]),note:note||undefined});
  });
  return {rows,errors};
}
function sumParsed(rows){const t={calories:0,protein:0,carbs:0,sugar:0,fat:0,saturatedFat:0,fiber:0,salt:0};rows.forEach(r=>{t.calories+=r.calories;t.protein+=r.protein;t.carbs+=r.carbs;t.sugar+=r.sugar;t.fat+=r.fat;t.saturatedFat+=r.saturatedFat;t.fiber+=r.fiber;t.salt+=r.salt;});return t;}
const deNum = n => String(Math.round(n*100)/100).replace('.',',');
const deDate = k => {const[y,m,d]=k.split('-');return d+'.'+m+'.'+y;};
function serializeEntries(entries){
  return entries.map(({date,entry:e})=>[deDate(date),MEALS[e.meal].label,e.name,e.quantity||'',deNum(e.calories),deNum(e.protein),deNum(e.carbs),deNum(e.sugar),deNum(e.fat),deNum(e.saturatedFat),deNum(e.fiber),deNum(e.salt),e.note||''].join('\t')).join('\n');
}

const DEFAULTS = {
  profile:{name:'',sex:'male',age:30,height:180,weight:80,targetWeight:null,activity:'light'},

function migrateDays(days){
  const out={};
  Object.keys(days||{}).forEach(k=>{
    const d=days[k]||{};
    out[k]={date:d.date||k,exercises:d.exercises||[],foods:(d.foods||[]).map(f=>Object.assign({meal:'snack',sugar:0,saturatedFat:0,fiber:0,salt:0,source:'manual'},f))};
  });
  return out;
}
function load(){
  try{
    const s=localStorage.getItem('essen-artifact');
    if(s){
      const p=JSON.parse(s);
      return {
        profile:{...DEFAULTS.profile,...(p.profile||{})},
        goal:{...DEFAULTS.goal,...(p.goal||{})},
        days:migrateDays(p.days),
      };
    }
  }catch(e){}
  return DEFAULTS;
}
function save(s){ try{localStorage.setItem('essen-artifact',JSON.stringify(s));}catch(e){} }

function addFoodTo(setState,date,food){

}
function addExTo(setState,date,ex){
  setState(s=>{const d=s.days[date]||{date,foods:[],exercises:[]};return{...s,days:{...s.days,[date]:{...d,exercises:[...d.exercises,{...ex,id:uid(),time:new Date().toISOString()}]}}};});
}
function importEntries(setState,rows,replace){
  setState(s=>{
    const days={...s.days};
    if(replace){[...new Set(rows.map(r=>r.date))].forEach(dt=>{const d=days[dt]||{date:dt,foods:[],exercises:[]};days[dt]={...d,foods:[]};});}
    const seq={};
    rows.forEach(r=>{
      const d=days[r.date]||{date:r.date,foods:[],exercises:[]};
      const i=seq[r.date]=(seq[r.date]||0)+1;
      const e={id:uid(),name:r.name,meal:r.meal,quantity:r.quantity,calories:Math.round(r.calories),protein:Math.round(r.protein),carbs:Math.round(r.carbs),sugar:Math.round(r.sugar),fat:Math.round(r.fat),saturatedFat:Math.round(r.saturatedFat),fiber:Math.round(r.fiber),salt:Math.round(r.salt*10)/10,note:r.note,source:'import',time:isoAt(r.date,MEALS[r.meal].hour,i)};
      days[r.date]={...d,foods:[...d.foods,e]};
    });
    return {...s,days};
  });
}

/* ---------- UI-Bausteine ---------- */
function Ring({consumed,budget}){
  const size=200,stroke=18,r=(size-stroke)/2,c=2*Math.PI*r;
  const frac=budget>0?Math.min(consumed/budget,1):0, over=consumed>budget, rem=budget-consumed;
  return (
    <div className="ring-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={over?'var(--danger)':'var(--accent)'} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-frac)} transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <div className="ring-center">
        <div className={'ring-value'+(over?' over':'')}>{Math.abs(rem)}</div>
        <div className="ring-label">{over?'kcal drüber':'kcal übrig'}</div>
      </div>
    </div>
  );
}
const MacroBar=({label,value,target,color,unit='g',limit=false})=>{
  const frac=target>0?Math.min(value/target,1):0, over=target>0&&value>target, fill=limit&&over?'var(--danger)':color;
  return (
    <div className="macro">
      <div className="macro-head"><span className="macro-label">{label}</span>
        <span className="macro-num">{value}<span className="muted"> {limit?'max.':'/'} {target} {unit}</span>{limit&&over&&<span className="warn-tag"> ⚠</span>}</span></div>
      <div className="bar"><div className="bar-fill" style={{width:frac*100+'%',background:fill}}/></div>
    </div>
  );
};
const DayBars=({data,unit='',color='var(--data)'})=>{
  const max=Math.max(...data.map(d=>Math.max(d.value,d.ref||0)),1);
  return (<div className="chart">{data.map(d=>{
    const h=(d.value/max)*100, refH=d.ref!=null?(d.ref/max)*100:null;
    return (
      <div className="chart-col" key={d.key} title={`${d.key}: ${d.value}${unit}`}>
        <div className="chart-bar-wrap">
          {refH!=null&&<div className="budget-line" style={{bottom:Math.min(refH,100)+'%'}}/>}
          <div className={'chart-bar'+(d.over?' over':'')} style={{height:Math.min(h,100)+'%',background:d.over?undefined:color}}/>
        </div>
        <div className="chart-label">{d.key.slice(8)}</div>
      </div>);})}</div>);
};
const Stat=({label,value,sub})=>(<div className="stat"><div className="stat-value">{value}</div><div className="stat-label">{label}</div>{sub&&<div className="stat-sub">{sub}</div>}</div>);
const Overlay=({title,onClose,children})=>(

    <div className="overlay-card">
      <div className="overlay-head"><h2>{title}</h2><button className="chip" onClick={onClose}>✕ Schließen</button></div>
      <div className="overlay-body">{children}</div>
    </div>
  </div>);

/* ---------- Import-Overlay ---------- */
function ImportPanel({setState,setDate,onClose}){
  const [text,setText]=useState('');
  const [replace,setReplace]=useState(false);
  const [done,setDone]=useState(null);
  const result=useMemo(()=>parseStructured(text),[text]);
  const totals=useMemo(()=>sumParsed(result.rows),[result.rows]);
  const byDate=useMemo(()=>{
    const map=new Map();
    result.rows.forEach(r=>{if(!map.has(r.date))map.set(r.date,[]);map.get(r.date).push(r);});
    return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  },[result.rows]);

  function doImport(){
    if(!result.rows.length)return;
    importEntries(setState,result.rows,replace);
    const first=[...new Set(result.rows.map(r=>r.date))].sort()[0];
    if(first)setDate(first);
    setDone({added:result.rows.length,days:new Set(result.rows.map(r=>r.date)).size});
  }

  if(done) return (
    <Overlay title="Import abgeschlossen" onClose={onClose}>
      <div className="card">
        <p className="import-success">✅ {done.added} Einträge auf {done.days} {done.days===1?'Tag':'Tage'} verteilt.</p>
        <p className="muted small">Datum und Mahlzeit wurden automatisch zugeordnet. Du findest alles unter „Heute" und im Archiv.</p>
        <button className="primary" onClick={onClose}>Fertig</button>
      </div>
    </Overlay>
  );

  return (
    <Overlay title="Strukturiert importieren" onClose={onClose}>
      <div className="card">
        <p className="muted small" style={{marginTop:0}}>Tabelle aus der Zwischenablage einfügen (Tab- oder |-getrennt). Spaltenreihenfolge:</p>
        <code className="import-cols">Datum · Mahlzeit · Nahrungsmittel · Menge · kcal · Eiweiß · KH · Zucker · Fett · ges. FS · Ballaststoffe · Salz · Notiz</code>
        <textarea className="import-text" placeholder="Hier die Tabelle einfügen…" value={text} onChange={e=>setText(e.target.value)} rows={8} spellCheck={false}/>
        <div className="import-actions">
          <button className="chip" onClick={()=>setText(IMPORT_EXAMPLE)}>Beispiel einfügen</button>
          {text && <button className="chip" onClick={()=>setText('')}>Leeren</button>}
        </div>
      </div>

      {result.errors.length>0 && (
        <div className="card import-warn">
          <h3 className="card-title">⚠ {result.errors.length} Zeile(n) übersprungen</h3>
          <ul className="err-list">
            {result.errors.slice(0,8).map(e=>(
              <li key={e.line}><strong>Zeile {e.line}:</strong> {e.reason}<div className="muted small ellipsis">{e.text}</div></li>))}
            {result.errors.length>8 && <li className="muted small">… und {result.errors.length-8} weitere</li>}
          </ul>
        </div>
      )}

      {result.rows.length>0 && (<>
        <div className="card"><div className="hero-stats">
          <Stat label="Einträge" value={result.rows.length}/>
          <Stat label={byDate.length===1?'Tag':'Tage'} value={byDate.length}/>
          <Stat label="kcal gesamt" value={totals.calories}/>
        </div></div>
        {byDate.map(([date,rows])=>(
          <div className="card" key={date}>
            <h3 className="card-title">{fullDate(date)}</h3>
            {MEAL_ORDER.map(meal=>{
              const items=rows.filter(r=>r.meal===meal); if(!items.length)return null;
              return (<div className="preview-meal" key={meal}>
                <div className="preview-meal-head">{MEALS[meal].icon} {MEALS[meal].label}</div>
                {items.map((r,i)=>(<div className="preview-row" key={i}>
                  <span className="preview-name">{r.name}{r.quantity&&<span className="muted"> · {r.quantity}</span>}</span>
                  <span className="preview-kcal">{Math.round(r.calories)} kcal</span></div>))}
              </div>);
            })}
          </div>
        ))}
        <label className="toggle"><input type="checkbox" checked={replace} onChange={e=>setReplace(e.target.checked)}/>
          <span>Betroffene Tage vor dem Import leeren (vorhandene Mahlzeiten ersetzen)</span></label>
        <button className="primary import-submit" onClick={doImport}>{result.rows.length} Einträge importieren</button>
      </>)}

      {!result.rows.length && !result.errors.length && text.trim()==='' &&
        <p className="empty">Noch nichts eingefügt. Tippe auf „Beispiel einfügen", um es auszuprobieren.</p>}
    </Overlay>
  );
}

      <input placeholder="Was hast du gegessen?" value={v.name} onChange={e=>ch('name')(e.target.value)}/>
      <div className="form-grid two">
        <select value={v.meal} onChange={e=>ch('meal')(e.target.value)}>{MEAL_ORDER.map(m=>(<option key={m} value={m}>{MEALS[m].icon} {MEALS[m].label}</option>))}</select>
        <input placeholder="Menge (z.B. 200 g)" value={v.quantity} onChange={e=>ch('quantity')(e.target.value)}/>
      </div>
      <div className="form-grid">
        <Mini label="kcal" v={v.calories} set={ch('calories')}/>
        <Mini label="Eiweiß" v={v.protein} set={ch('protein')}/>
        <Mini label="KH" v={v.carbs} set={ch('carbs')}/>
        <Mini label="Fett" v={v.fat} set={ch('fat')}/>
      </div>
      <div className="form-grid">
        <Mini label="Zucker" v={v.sugar} set={ch('sugar')}/>
        <Mini label="ges. FS" v={v.saturatedFat} set={ch('saturatedFat')}/>
        <Mini label="Ballast." v={v.fiber} set={ch('fiber')}/>
        <Mini label="Salz" v={v.salt} set={ch('salt')}/>
      </div>
      <input placeholder="Notiz (optional)" value={v.note} onChange={e=>ch('note')(e.target.value)}/>
      <button type="submit" className="primary">Hinzufügen</button>
    </form>
  );
}
function ExerciseForm({onSubmit}){
  const [v,setV]=useState({name:'',durationMin:'',calories:''});
  const ch=k=>e=>setV({...v,[k]:e.target.value});
  return (
    <form className="form" onSubmit={e=>{e.preventDefault();if(!v.name.trim())return;
      onSubmit({name:v.name.trim(),durationMin:v.durationMin?+v.durationMin:undefined,calories:+v.calories||0});}}>
      <input placeholder="Aktivität (z.B. Joggen)" value={v.name} onChange={ch('name')}/>
      <div className="form-grid two">
        <input inputMode="numeric" placeholder="Minuten" value={v.durationMin} onChange={ch('durationMin')}/>
        <input inputMode="numeric" placeholder="kcal verbrannt" value={v.calories} onChange={ch('calories')}/>
      </div>
      <button type="submit" className="primary">Hinzufügen</button>
    </form>
  );
}

/* ---------- Auswertung ---------- */
const METRICS=[{id:'calories',label:'Kalorien',unit:' kcal'},{id:'protein',label:'Eiweiß',unit:' g'},{id:'carbs',label:'KH',unit:' g'},{id:'fat',label:'Fett',unit:' g'},{id:'fiber',label:'Ballaststoffe',unit:' g'},{id:'sugar',label:'Zucker',unit:' g'},{id:'salt',label:'Salz',unit:' g'}];
const METRIC_COLOR={calories:'var(--data)',protein:'var(--protein)',carbs:'var(--carbs)',fat:'var(--fat)',fiber:'var(--fiber)',sugar:'var(--sugar)',salt:'var(--salt)'};
const avgArr = arr => arr.length?Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10:0;
function Stats({state}){
  const {profile,goal,days}=state;
  const [range,setRange]=useState(7);
  const [metric,setMetric]=useState('calories');
  const today=todayKey();
  const rows=useMemo(()=>{
    const keys=[]; for(let i=range-1;i>=0;i--)keys.push(addDays(today,-i));
    return keys.map(k=>{const d=days[k]||{foods:[],exercises:[]};const burned=Math.round(d.exercises.reduce((a,e)=>a+(+e.calories||0),0));
      return {key:k,budget:dailyBudget(profile,goal,burned),totals:sumNut(d.foods),target:targetMacros(dailyBudget(profile,goal,burned),goal),meals:mealTotals(d.foods),has:d.foods.length>0};});
  },[days,profile,goal,range,today]);
  const tracked=rows.filter(r=>r.has);

  const chartData=rows.map(r=>{
    let value=0,ref=undefined,over=false;
    if(metric==='calories'){value=r.totals.calories;ref=r.budget;over=value>r.budget;}
    else if(metric==='protein'){value=r.totals.protein;ref=r.target.protein;}
    else if(metric==='carbs'){value=r.totals.carbs;ref=r.target.carbs;}
    else if(metric==='fat'){value=r.totals.fat;ref=r.target.fat;}
    else if(metric==='fiber'){value=r.totals.fiber;ref=goal.fiberGoal;}
    else if(metric==='sugar'){value=r.totals.sugar;ref=goal.sugarLimit;over=value>goal.sugarLimit;}
    else if(metric==='salt'){value=r.totals.salt;ref=goal.saltLimit;over=value>goal.saltLimit;}
    return {key:r.key,value,ref,over};
  });
  const mInfo=METRICS.find(m=>m.id===metric);
  const tValues=chartData.filter((_,i)=>rows[i].has).map(d=>d.value);
  const mAvg=avgArr(tValues);
  const half=Math.floor(tValues.length/2);
  const trend=tValues.length>=4?avgArr(tValues.slice(half))-avgArr(tValues.slice(0,half)):0;

  const avgTotals={calories:avgArr(tracked.map(r=>r.totals.calories)),protein:avgArr(tracked.map(r=>r.totals.protein)),carbs:avgArr(tracked.map(r=>r.totals.carbs)),sugar:avgArr(tracked.map(r=>r.totals.sugar)),fat:avgArr(tracked.map(r=>r.totals.fat)),saturatedFat:avgArr(tracked.map(r=>r.totals.saturatedFat)),fiber:avgArr(tracked.map(r=>r.totals.fiber)),salt:avgArr(tracked.map(r=>r.totals.salt))};
  const avgBudget=Math.round(avgArr(rows.map(r=>r.budget)));
  const avgTarget=targetMacros(avgBudget,goal);
  const mealAvg=MEAL_ORDER.map(meal=>({meal,kcal:avgArr(tracked.map(r=>r.meals[meal].calories))}));
  const mealMax=Math.max(...mealAvg.map(m=>m.kcal),1);
  const withinBudget=tracked.filter(r=>r.totals.calories<=r.budget).length;
  const avgDev=tracked.length?Math.round(avgArr(tracked.map(r=>r.totals.calories-r.budget))):0;
  let streak=0; for(let i=0;;i++){const k=addDays(today,-i);if((days[k]&&days[k].foods.length)>0)streak++;else break;}

  return (
    <div className="page">
      <header className="chat-head"><h2>Auswertung</h2>
        <div className="seg">{[7,14,30,90].map(r=>(<button key={r} className={range===r?'on':''} onClick={()=>setRange(r)}>{r} T</button>))}</div></header>

      <section className="card">
        <h3 className="card-title">Zeitverlauf</h3>
        <div className="metric-chips">{METRICS.map(m=>(<button key={m.id} className={'metric-chip'+(metric===m.id?' on':'')} onClick={()=>setMetric(m.id)}>{m.label}</button>))}</div>
        <DayBars data={chartData} unit={mInfo.unit} color={METRIC_COLOR[metric]}/>
        <div className="chart-legend"><span><i className="sw" style={{background:METRIC_COLOR[metric]}}/> Wert</span><span><i className="sw line"/> Ziel/Budget</span><span><i className="sw danger"/> über Ziel</span></div>
        {tracked.length>0 &&
          <div className="avg-row" style={{marginTop:12}}><span>Ø {mInfo.label}{tValues.length>=4&&<span className="muted small"> {trend>0?'↑ steigend':trend<0?'↓ fallend':'→ stabil'}</span>}</span><strong>{mAvg}{mInfo.unit}</strong></div>}
      </section>

      <section className="card">
        <h3 className="card-title">Durchschnitt {tracked.length>0?`(${tracked.length} erfasste Tage)`:''}</h3>
        <div className="avg-row"><span>Ø Kalorien</span><strong>{avgTotals.calories} kcal</strong></div>
        <div style={{height:12}}/>
        <MacroBar label="Ø Eiweiß" value={avgTotals.protein} target={avgTarget.protein} color="var(--protein)"/>
        <MacroBar label="Ø Kohlenhydrate" value={avgTotals.carbs} target={avgTarget.carbs} color="var(--carbs)"/>
        <MacroBar label="Ø Fett" value={avgTotals.fat} target={avgTarget.fat} color="var(--fat)"/>
      </section>

      <section className="card">
        <h3 className="card-title">Ø weitere Nährwerte</h3>
        <MacroBar label="Ballaststoffe" value={avgTotals.fiber} target={goal.fiberGoal} color="var(--fiber)"/>
        <MacroBar label="Zucker" value={avgTotals.sugar} target={goal.sugarLimit} color="var(--sugar)" limit/>
        <MacroBar label="ges. Fettsäuren" value={avgTotals.saturatedFat} target={goal.satFatLimit} color="var(--satfat)" limit/>
        <MacroBar label="Salz" value={avgTotals.salt} target={goal.saltLimit} color="var(--salt)" limit/>
      </section>

      <section className="card">
        <h3 className="card-title">Ø Kalorien nach Mahlzeit</h3>
        {mealAvg.map(m=>(
          <div className="macro" key={m.meal}>
            <div className="macro-head"><span className="macro-label">{MEALS[m.meal].icon} {MEALS[m.meal].label}</span><span className="macro-num">{m.kcal} kcal</span></div>
            <div className="bar"><div className="bar-fill" style={{width:(m.kcal/mealMax)*100+'%',background:'var(--data)'}}/></div>
          </div>))}
      </section>

      <section className="card">
        <h3 className="card-title">Tracking-Treue</h3>
        <div className="energy-row"><span>Erfasste Tage (Zeitraum)</span><strong>{tracked.length} / {range}</strong></div>
        <div className="energy-row"><span>Tage im Budget</span><strong>{withinBudget} / {tracked.length||0}</strong></div>
        <div className="energy-row"><span>Ø Abweichung vom Budget</span><strong className={avgDev>0?'over':''}>{avgDev>0?'+':''}{avgDev} kcal</strong></div>
        <div className="energy-row total"><span>🔥 Aktuelle Serie</span><strong>{streak} {streak===1?'Tag':'Tage'}</strong></div>
      </section>

      {tracked.length===0 && <p className="empty">Noch keine Daten im Zeitraum. Importiere oder erfasse Mahlzeiten.</p>}
    </div>
  );
}

/* ---------- Archiv ---------- */
function Archive({state,setState,setDate,goToToday,openImport}){
  const {profile,goal,days}=state;
  const [showExport,setShowExport]=useState(false);
  const dayList=useMemo(()=>Object.values(days).filter(d=>d.foods.length>0||d.exercises.length>0).sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{
    const totals=sumNut(d.foods); const burned=Math.round(d.exercises.reduce((a,e)=>a+(+e.calories||0),0)); const budget=dailyBudget(profile,goal,burned);
    return {...d,totals,budget,over:totals.calories>budget};
  }),[days,profile,goal]);
  const groups=useMemo(()=>{const map=new Map();dayList.forEach(d=>{const l=monthLabel(d.date);if(!map.has(l))map.set(l,[]);map.get(l).push(d);});return [...map.entries()];},[dayList]);
  const totalDays=dayList.length, totalEntries=dayList.reduce((a,d)=>a+d.foods.length,0);
  const open=date=>{setDate(date);goToToday();};
  const del=date=>{if(confirm('Tag '+dateLabel(date)+' wirklich aus dem Archiv löschen?'))setState(s=>{const ds={...s.days};delete ds[date];return{...s,days:ds};});};

  return (
    <div className="page">
      <header className="chat-head"><h2>Archiv</h2>
        <div className="section-actions">
          <button className="chip" onClick={openImport}>📋 Import</button>
          {totalEntries>0 && <button className="chip" onClick={()=>setShowExport(true)}>⬇ Export</button>}
        </div></header>
      {totalDays>0 &&
        <section className="card"><div className="hero-stats">
          <Stat label="erfasste Tage" value={totalDays}/>
          <Stat label="Einträge" value={totalEntries}/>
        </div></section>}
      {totalDays===0 && <p className="empty">Noch keine Tage im Archiv. Importiere deine Tabelle oder erfasse Mahlzeiten unter „Heute".</p>}
      {groups.map(([month,list])=>(
        <div key={month}>
          <h3 className="month-head">{month}</h3>
          <section className="card archive-card">
            <ul className="archive-list">{list.map(d=>(
              <li className="archive-day" key={d.date}>
                <button className="archive-open" onClick={()=>open(d.date)}>
                  <div className="archive-date"><span className="archive-wd">{weekdayShort(d.date)}</span><span className="archive-label">{dateLabel(d.date)}</span></div>
                  <div className="archive-meta"><span className="muted small">E {d.totals.protein} · KH {d.totals.carbs} · F {d.totals.fat} g · {d.foods.length} Einträge</span></div>
                  <div className={'archive-kcal'+(d.over?' over':'')}>{d.totals.calories}<span className="muted small"> / {d.budget}</span></div>
                </button>
                <button className="del" onClick={()=>del(d.date)}>×</button>
              </li>))}</ul>
          </section>
        </div>
      ))}
      {showExport && <ExportOverlay days={days} onClose={()=>setShowExport(false)}/>}
    </div>
  );
}
function ExportOverlay({days,onClose}){
  const [copied,setCopied]=useState(false);
  const tsv=useMemo(()=>{
    const entries=[];
    Object.values(days).forEach(day=>day.foods.forEach(f=>entries.push({date:day.date,entry:f})));
    entries.sort((a,b)=>a.date.localeCompare(b.date)||a.entry.time.localeCompare(b.entry.time));
    return serializeEntries(entries);
  },[days]);
  async function copy(){try{await navigator.clipboard.writeText(tsv);setCopied(true);setTimeout(()=>setCopied(false),1500);}catch(e){}}
  function download(){const blob=new Blob([tsv],{type:'text/tab-separated-values'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='essen-export-'+todayKey()+'.tsv';a.click();URL.revokeObjectURL(url);}
  return (
    <Overlay title="Export (Tab-Format)" onClose={onClose}>
      <div className="card">
        <p className="muted small" style={{marginTop:0}}>Alle Einträge im selben Format wie der Import – kann gesichert oder wieder eingespielt werden.</p>
        <div className="import-actions">
          <button className="chip" onClick={copy}>{copied?'✓ Kopiert':'📋 Kopieren'}</button>
          <button className="chip" onClick={download}>⬇ Als Datei</button>
        </div>
        <textarea className="import-text" value={tsv} readOnly rows={12} spellCheck={false}/>
      </div>
    </Overlay>
  );
}

/* ---------- Profil ---------- */
const PRESETS=[{mode:'lose',label:'Abnehmen (−500)',adj:-500},{mode:'lose',label:'Leicht abnehmen (−300)',adj:-300},{mode:'maintain',label:'Halten (±0)',adj:0},{mode:'gain',label:'Aufbauen (+300)',adj:300},{mode:'gain',label:'Aufbauen (+500)',adj:500}];
function Profile({state,setState}){
  const {profile,goal}=state;
  const setP=p=>setState(s=>({...s,profile:{...s.profile,...p}}));
  const setG=g=>setState(s=>({...s,goal:{...s.goal,...g}}));
  const tgt=targetMacros(maintenance(profile)+goal.adjustment,goal);
  const macroSum=goal.proteinPct+goal.carbsPct+goal.fatPct;
  const perWeek=weeklyChange(goal.adjustment);
  const weeks=weeksToTarget(profile,goal);
  const pickDiet=style=>setG({dietStyle:style,...DIET_MACROS[style]});
  return (
    <div className="page">
      <header className="chat-head"><h2>Profil &amp; Wünsche</h2></header>
      <section className="card"><div className="hero-stats">
        <Stat label="Grundumsatz" value={bmr(profile)} sub="kcal/Tag"/>
        <Stat label="Erhaltung" value={maintenance(profile)} sub="kcal/Tag"/>
        <Stat label="Budget-Ziel" value={maintenance(profile)+goal.adjustment} sub="kcal/Tag"/>
      </div></section>

      <section className="card">
        <h3 className="card-title">Über dich</h3>
        <div className="field"><label>Name (optional)</label><input placeholder="Wie sollen wir dich nennen?" value={profile.name||''} onChange={e=>setP({name:e.target.value})}/></div>
        <div className="field"><label>Geschlecht</label>
          <div className="seg full">{['male','female'].map(s=>(<button key={s} className={profile.sex===s?'on':''} onClick={()=>setP({sex:s})}>{s==='male'?'Männlich':'Weiblich'}</button>))}</div></div>
        <div className="field-grid">
          {[['age','Alter','J'],['height','Größe','cm'],['weight','Gewicht','kg']].map(([k,l,u])=>(
            <div className="field" key={k}><label>{l}</label>
              <div className="num-suffix"><input inputMode="decimal" value={profile[k]} onChange={e=>setP({[k]:numDe(e.target.value)})}/><span>{u}</span></div></div>))}
        </div>
        <div className="field"><label>Alltagsaktivität (ohne Sport)</label>
          <select value={profile.activity} onChange={e=>setP({activity:e.target.value})}>{Object.keys(ACTIVITY).map(a=>(<option key={a} value={a}>{ACTIVITY[a].label}</option>))}</select></div>
      </section>

      <section className="card">
        <h3 className="card-title">Dein Ziel</h3>
        <div className="presets">{PRESETS.map(p=>(<button key={p.label} className={'preset'+(goal.adjustment===p.adj?' on':'')} onClick={()=>setG({adjustment:p.adj})}>{p.label}</button>))}</div>
        <div className="field-grid two">
          <div className="field"><label>Wunschgewicht</label>
            <div className="num-suffix"><input inputMode="decimal" placeholder="–" value={profile.targetWeight??''} onChange={e=>{const t=e.target.value.replace(',','.').trim();setP({targetWeight:t===''?null:(+t||null)});}}/><span>kg</span></div></div>
          <div className="field"><label>Tempo (geschätzt)</label><div className="num-static">{perWeek>0?'+':''}{perWeek} kg / Woche</div></div>
        </div>
        {weeks!=null && profile.targetWeight!=null && <p className="muted small">≈ {weeks} Wochen bis {profile.targetWeight} kg (rund {Math.round(weeks/4.3)} Monate) bei diesem Tempo.</p>}
        <label className="toggle"><input type="checkbox" checked={goal.addExercise} onChange={e=>setG({addExercise:e.target.checked})}/><span>Verbrannte Sportkalorien zum Tagesbudget addieren</span></label>
      </section>

      <section className="card">
        <h3 className="card-title">Ernährungsstil</h3>
        <p className="muted small" style={{marginTop:0}}>Wählt eine passende Makro-Verteilung als Startpunkt – du kannst sie unten anpassen.</p>
        <div className="field"><select value={goal.dietStyle} onChange={e=>pickDiet(e.target.value)}>{Object.keys(DIET_LABELS).map(d=>(<option key={d} value={d}>{DIET_LABELS[d]}</option>))}</select></div>
      </section>

      <section className="card">
        <h3 className="card-title">Makro-Verteilung</h3>
        <p className={'muted small'} style={{color:macroSum!==100?'var(--protein)':'var(--muted)'}}>Summe: {macroSum}% {macroSum!==100?'(sollte 100% sein)':'✓'}</p>
        {[['proteinPct','Eiweiß','var(--protein)',tgt.protein],['carbsPct','Kohlenhydrate','var(--carbs)',tgt.carbs],['fatPct','Fett','var(--fat)',tgt.fat]].map(([k,l,c,g])=>(
          <div className="pct" key={k}>
            <div className="pct-head"><span style={{color:c}}>● {l}</span><span className="muted">{goal[k]}% · {g} g</span></div>
            <input type="range" min="0" max="100" step="5" value={goal[k]} onChange={e=>setG({[k]:+e.target.value})}/>
          </div>))}
      </section>

      <section className="card">
        <h3 className="card-title">Weitere Nährwert-Ziele</h3>
        <p className="muted small" style={{marginTop:0}}>Richtwerte – passe sie an deine Wünsche an. Ziel = anstreben, Limit = möglichst nicht überschreiten.</p>
        <div className="field-grid two">
          {[['fiberGoal','Ballaststoffe-Ziel'],['sugarLimit','Zucker-Limit'],['saltLimit','Salz-Limit'],['satFatLimit','ges. FS-Limit']].map(([k,l])=>(
            <div className="field" key={k}><label>{l}</label>
              <div className="num-suffix"><input inputMode="decimal" value={goal[k]} onChange={e=>setG({[k]:numDe(e.target.value)})}/><span>g</span></div></div>))}
        </div>
      </section>

      <section className="card">
        <h3 className="card-title">Vorlieben &amp; Hinweise</h3>
        <p className="muted small" style={{marginTop:0}}>Allergien, Unverträglichkeiten, Lieblings- oder No-Go-Lebensmittel. Fließt in die KI-Vorschläge ein.</p>
        <textarea className="pref-text" placeholder="z.B. vegetarisch, keine Laktose, mag kein Fisch, viel Gemüse …" value={goal.preferences} onChange={e=>setG({preferences:e.target.value})} rows={3}/>
      </section>

      <p className="footer-note">Daten bleiben lokal in diesem Browser (offline-fähig). Erfassung per „📋 Import“ (Copy &amp; Paste) oder „+ manuell“.</p>
    </div>
  );
}

/* ---------- App ---------- */
const TABS=[{id:'today',label:'Heute',icon:'🍽️'},{id:'stats',label:'Analyse',icon:'📊'},{id:'archive',label:'Archiv',icon:'🗄️'},{id:'profile',label:'Profil',icon:'⚙️'}];
function App(){
  const [state,setState]=useState(load);
  const [tab,setTab]=useState('today');
  const [date,setDate]=useState(todayKey());
  const [importOpen,setImportOpen]=useState(false);
  useEffect(()=>{save(state);},[state]);

  return (
    <div className="app">
      <main className="content">
        {tab==='today' && <Today state={state} setState={setState} date={date} setDate={setDate} openImport={()=>setImportOpen(true)}/>}
        {tab==='stats' && <Stats state={state}/>}
        {tab==='archive' && <Archive state={state} setState={setState} setDate={setDate} goToToday={()=>setTab('today')} openImport={()=>setImportOpen(true)}/>}
        {tab==='profile' && <Profile state={state} setState={setState}/>}
      </main>
      <nav className="tabbar">
        <div className="brand"><span className="brand-icon">🍊</span><span className="brand-name">Essen</span></div>
        {TABS.map(t=>(
        <button key={t.id} className={'tab'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
          <span className="tab-icon">{t.icon}</span><span className="tab-label">{t.label}</span></button>))}
      </nav>
      {importOpen && <ImportPanel setState={setState} setDate={setDate} onClose={()=>setImportOpen(false)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
